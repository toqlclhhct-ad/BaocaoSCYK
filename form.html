<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo cáo sự cố y khoa</title>
    <style>
        :root { --primary-color: #2980b9; --bg-body: #f4f7f6; --gray-light: #e9ecef; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-body); padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        header { 
            display: flex; align-items: center; gap: 15px;
            border-bottom: 3px solid var(--primary-color); margin-bottom: 25px; padding-bottom: 15px;
        }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #333; }
        input, select, textarea { 
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; 
            box-sizing: border-box; font-size: 14px; outline: none;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary-color); box-shadow: 0 0 5px rgba(41,128,185,0.2); }
        
        /* Ô Số báo cáo xám nhẹ */
        .readonly-field { background-color: var(--gray-light); color: #666; cursor: not-allowed; font-weight: bold; }

        .btn-submit { 
            background: #27ae60; color: white; border: none; padding: 12px 30px; 
            border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; 
            width: 100%; transition: 0.3s; margin-top: 20px;
        }
        .btn-submit:hover { background: #219150; }
        .loading { display: none; text-align: center; margin-top: 10px; color: var(--primary-color); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <img src="https://i.postimg.cc/s2zWMnCs/Logo-Benh-vien.jpg" alt="Logo" style="width: 50px; height: auto;">
        <h2 style="color: var(--primary-color); text-transform: uppercase; margin: 0; font-size: 18px;">MẪU BÁO CÁO SỰ CỐ Y KHOA (Phụ lục III Ban hành kèm theo Thông tư 43/2018/TT-BYT)</h2>
    </header>

    <form id="incidentForm">
        <div class="form-group">
            <label>Số báo cáo (Hệ thống tự tạo):</label>
            <input type="text" id="reportId" name="reportId" class="readonly-field" readonly>
        </div>

        <div class="form-group">
            <label>1. Ngày báo cáo:</label>
            <input type="date" id="reportDate" name="reportDate" required>
        </div>

        <div class="form-group">
            <label>4. Khoa/Phòng xảy ra sự cố:</label>
            <select name="dept" required>
                <option value="">-- Chọn khoa/phòng --</option>
                <option value="Khoa Khám bệnh">Khoa Khám bệnh</option>
                <option value="Khoa Dược">Khoa Dược</option>
                <option value="Khoa Tiếp nhận máu">Khoa Tiếp nhận máu</option>
                <option value="Khoa Xét nghiệm">Khoa Xét nghiệm</option>
            </select>
        </div>

        <div class="form-group">
            <label>11. Vị trí xảy ra sự cố:</label>
            <select name="location" required>
                <option value="">-- Chọn vị trí --</option>
                <option value="Phòng bệnh">Phòng bệnh</option>
                <option value="Hành lang">Hành lang</option>
                <option value="Phòng khám">Phòng khám</option>
                <option value="Khu vực chờ">Khu vực chờ</option>
                <option value="Nhà vệ sinh">Nhà vệ sinh</option>
            </select>
        </div>

        <div class="form-group">
            <label>Mô tả sự cố:</label>
            <textarea name="description" rows="4" placeholder="Mô tả chi tiết diễn biến sự cố..." required></textarea>
        </div>

        <div class="form-group">
            <label>Mức độ sự cố:</label>
            <select name="level" required>
                <option value="Nhẹ">Nhẹ</option>
                <option value="Trung bình">Trung bình</option>
                <option value="Nặng">Nặng</option>
            </select>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">GỬI BÁO CÁO</button>
        <div class="loading" id="loader">Đang gửi dữ liệu, vui lòng đợi...</div>
    </form>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwsgg3TyHuF60XbkdaHr6uTrXW8akj5Np9f9MjKoC0nNhZoFHnekWpkqpQzAYPpdjQ/exec';

    // Tự động sinh Số báo cáo và Ngày khi vừa load trang
    window.onload = () => {
        const now = new Date();
        
        // Sinh số BC định dạng: DDMMYY.HHMM
        const d = String(now.getDate()).padStart(2, '0');
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const y = String(now.getFullYear()).slice(-2);
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        
        document.getElementById('reportId').value = `${d}${m}${y}.${hh}${mm}`;
        
        // Gán ngày hiện tại cho ô Ngày báo cáo
        document.getElementById('reportDate').valueAsDate = now;
    };

    document.getElementById('incidentForm').addEventListener('submit', e => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        
        btn.style.display = 'none';
        loader.style.display = 'block';

        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());

        fetch(scriptURL + '?action=add', {
            method: 'POST',
            body: JSON.stringify(data)
        })
        .then(res => {
            alert('Gửi báo cáo THÀNH CÔNG!');
            window.location.href = 'index.html'; // Quay lại trang chủ
        })
        .catch(err => {
            alert('Có lỗi xảy ra, vui lòng thử lại!');
            btn.style.display = 'block';
            loader.style.display = 'none';
        });
    });
</script>

</body>
</html>
