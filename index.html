<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo cáo Sự cố Y khoa - TT43</title>
    <style>
        :root { 
            --title-color: #2980b9; 
            --btn-color: #27ae60;   
            --bg-body: #f4f7f6; 
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-body); padding: 20px; line-height: 1.5; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        header { 
    display: grid;
    grid-template-columns: 80px 1fr 80px; /* Chia 3 phần: Logo - Chữ - Khoảng trống cân bằng */
    align-items: center; 
    border-bottom: 3px solid var(--title-color); 
    margin-bottom: 30px; 
    padding-bottom: 15px;
}
.logo-bv { width: 80px; height: auto; }
.header-text { 
    text-align: center; /* Căn giữa nội dung chữ */
}
.header-text h2 { color: var(--title-color); text-transform: uppercase; margin: 0; font-size: 24px; }
.header-text p { margin: 5px 0 0; font-size: 13px; color: #7f8c8d; }

        fieldset { border: 1px solid #dcdde1; border-radius: 10px; margin-bottom: 25px; padding: 20px; background: #fff; }
        legend { font-weight: bold; color: var(--title-color); padding: 0 15px; font-size: 16px; text-transform: uppercase; }
        
        /* CHIA 4 CỘT ĐỀU NHAU */
        .grid-4 { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 15px; 
            margin-bottom: 15px; 
        }
        
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 7px; color: #34495e; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; font-size: 13.5px; }
        textarea { height: 80px; }
        
        .btn-submit { 
            background: var(--btn-color); color: white; border: none; padding: 18px; width: 100%; border-radius: 8px; 
            font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; 
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3); 
        }
        .btn-submit:hover { background: #219150; transform: translateY(-2px); }

        /* Responsive cho điện thoại (chuyển về 1 cột nếu màn hình nhỏ) */
        @media (max-width: 768px) {
            .grid-4 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    
    <header>
    <img src="https://i.postimg.cc/s2zWMnCs/Logo-Benh-vien.jpg" alt="Logo" class="logo-bv">
    <div class="header-text">
        <h2>Báo cáo sự cố y khoa</h2>
        <p>(Mẫu Phụ lục III - Ban hành kèm theo Thông tư số 43/2018/TT-BYT)</p>
    </div>
    <div style="width: 80px;"></div> </header>

    <form id="incidentForm">
        <fieldset>
            <legend>I. Thông tin hành chính</legend>
            <div class="grid-4">
                <div>
                    <label>2. Hình thức báo cáo</label>
                    <select name="hinhThuc" required>
                        <option value="Tự nguyện">Tự nguyện</option>
                        <option value="Bắt buộc">Bắt buộc</option>
                    </select>
                </div>
                <div><label>3. Số báo cáo</label><input type="text" name="soBaoCao" required></div>
                <div><label>4. Ngày báo cáo</label><input type="date" name="ngayBaoCao" required></div>
                <div>
                    <label>5. Đơn vị báo cáo</label>
                    <select name="donViBaoCao" required>
                        <option value="">-- Chọn khoa/phòng --</option>
                        <option>Khoa Khám bệnh</option><option>Khoa Điều trị</option>
                        <option>Khoa KSNK</option><option>Khoa Dược</option>
                    </select>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>II. Thông tin người bệnh</legend>
            <div class="grid-4">
                <div><label>6. Họ và tên</label><input type="text" name="tenBN" placeholder="Viết tắt"></div>
                <div><label>7. Số bệnh án</label><input type="text" name="soBA"></div>
                <div><label>8. Ngày sinh</label><input type="date" name="ngaySinhBN"></div>
                <div><label>9. Giới tính</label><select name="gioiTinhBN"><option>Nam</option><option>Nữ</option></select></div>
            </div>
            <div style="margin-top:10px;">
                <label>10. Khoa/Phòng đang nằm viện</label><input type="text" name="khoaDangNam">
            </div>
        </fieldset>

        <fieldset>
            <legend>III. Chi tiết sự cố</legend>
            <div class="grid-4">
                <div>
                    <label>11. Đối tượng xảy ra</label>
                    <select name="doiTuongSuCo" required>
                        <option>Người bệnh</option><option>NVYT</option><option>Khác</option>
                    </select>
                </div>
                <div><label>12. Vị trí (Khoa/Phòng)</label><input type="text" name="viTriChung" required></div>
                <div><label>13. Vị trí cụ thể</label><input type="text" name="viTriCuThe"></div>
                <div><label>14. Ngày xảy ra</label><input type="date" name="ngayXayRa" required></div>
            </div>
            <div class="grid-4" style="margin-top:10px;">
                <div><label>15. Giờ xảy ra</label><input type="time" name="gioXayRa" required></div>
            </div>
            <div style="margin-top:10px;">
                <label>16. Mô tả ngắn gọn</label><textarea name="moTa" required></textarea>
                <label>17. Đề xuất giải pháp</label><textarea name="deXuat"></textarea>
                <label>18. Điều trị/Xử lý đã thực hiện</label><textarea name="xuLyBanDau"></textarea>
            </div>
        </fieldset>

        <fieldset>
            <legend>IV. Thông báo & V. Đánh giá</legend>
            <div class="grid-4">
                <div><label>19. Thông báo BS</label><select name="tbBacSi"><option>Có</option><option>Không</option></select></div>
                <div><label>20. Ghi vào HSBA</label><select name="ghiHSBA"><option>Có</option><option>Không</option></select></div>
                <div><label>21. TB người nhà</label><select name="tbNguoiNha"><option>Có</option><option>Không</option></select></div>
                <div><label>22. TB người bệnh</label><select name="tbNguoiBenh"><option>Có</option><option>Không</option></select></div>
            </div>
            <div class="grid-4" style="margin-top:15px;">
                <div><label>23. Phân loại</label><select name="phanLoaiBanDau"><option>Chưa xảy ra</option><option>Đã xảy ra</option></select></div>
                <div><label>24. Mức độ ảnh hưởng</label><select name="mucDoAnhHuong"><option>Nhẹ</option><option>Trung bình</option><option>Nặng</option></select></div>
            </div>
        </fieldset>

        <fieldset>
            <legend>VI. Thông tin người báo cáo</legend>
            <div class="grid-4">
                <div><label>25. Họ tên</label><input type="text" name="tenNguoiBao"></div>
                <div><label>26. SĐT</label><input type="text" name="sdtNguoiBao"></div>
                <div><label>27. Email</label><input type="email" name="emailNguoiBao"></div>
                <div>
                    <label>28. Đối tượng</label>
                    <select name="loaiNguoiBao">
                        <option>Bác sĩ</option><option>Điều dưỡng</option><option>Khác</option>
                    </select>
                </div>
            </div>
        </fieldset>

        <button type="submit" id="submitBtn" class="btn-submit">GỬI BÁO CÁO VỀ HỆ THỐNG</button>
    </form>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbygN-sZDI6i5xGNj-cN2UM9LEtAM1N0enmzHFi-fwfYcjwO8llZ6_FICwQUuOFlDsY/exec';
    const form = document.getElementById('incidentForm');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btn.disabled = true;
        btn.innerText = 'Đang gửi dữ liệu...';
        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
        .then(res => {
            alert('Gửi báo cáo THÀNH CÔNG!');
            form.reset();
        })
        .catch(err => alert('Lỗi kết nối!'))
        .finally(() => {
            btn.disabled = false;
            btn.innerText = 'GỬI BÁO CÁO VỀ HỆ THỐNG';
        });
    });
</script>
</body>
</html>
