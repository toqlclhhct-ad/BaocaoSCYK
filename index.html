<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Sự cố Y khoa</title>
    <style>
        :root { --primary: #2980b9; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        
        /* Layout biểu đồ */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .chart-card { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 20px; height: 350px; position: relative; }
        .full-width { grid-column: span 2; height: 400px; }

        /* Bộ lọc */
        .filter-section { display: flex; flex-wrap: wrap; gap: 10px; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #eee; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 12px; font-weight: bold; color: #666; }
        .filter-group input, .filter-group select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }

        /* Bảng dữ liệu */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: var(--primary); color: white; padding: 12px; text-align: left; position: sticky; top: 0; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .status-pill { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; color: white; }
        .status-Nặng { background: #e74c3c; } .status-Trung-bình { background: #f39c12; } .status-Nhẹ { background: #3498db; }
    </style>
</head>
<body>

<div class="container">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--primary); padding-bottom: 10px;">
        <h2 style="color: var(--primary); margin: 0;">HỆ THỐNG QUẢN LÝ SỰ CỐ Y KHOA</h2>
        <button onclick="window.location.reload()" style="padding: 8px 15px; cursor: pointer;">Làm mới dữ liệu</button>
    </header>

    <div class="dashboard-grid">
        <div class="chart-card"><canvas id="deptChart"></canvas></div>
        <div class="chart-card"><canvas id="levelChart"></canvas></div>
        <div class="chart-card full-width"><canvas id="trendChart"></canvas></div>
    </div>

    <div class="filter-section">
        <div class="filter-group"><label>Khoa/Phòng:</label><select id="filterDept" onchange="filterData()"><option value="">-- Tất cả --</option></select></div>
        <div class="filter-group"><label>Mức độ:</label><select id="filterLevel" onchange="filterData()"><option value="">-- Tất cả --</option><option value="Nhẹ">Nhẹ</option><option value="TB">TB</option><option value="Nặng">Nặng</option></select></div>
        <div class="filter-group" style="flex-grow: 1;"><label>Tìm kiếm:</label><input type="text" id="searchDesc" placeholder="Nhập nội dung tìm kiếm..." onkeyup="filterData()"></div>
    </div>

    <div style="overflow-x: auto; max-height: 450px; border: 1px solid #ddd;">
        <table>
            <thead>
                <tr>
                    <th>Ngày BC</th>
                    <th>Đơn vị báo cáo</th>
                    <th>Mô tả sự cố</th>
                    <th>Mức độ ảnh hưởng</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="4" style="text-align: center; padding: 30px;">Đang tải dữ liệu...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<script>
    // 1. Cấu hình URL Web App của bạn
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwhddoy_kv6FaHQHV-LM4pHnCvhiCnW1SQpf2hZGOjAmA7EPgx-0EE8j43SgPDa_5A/exec';
    
    let originalData = [];
    let charts = {};

    // Đăng ký Plugin hiển thị số lên Chart.js
    Chart.register(ChartDataLabels);

    // Hàm chuyển đổi ngày từ dd/mm/yyyy
    const parseDate = (s) => {
        if (!s) return new Date(0);
        const p = s.split('/');
        return new Date(p[2], p[1] - 1, p[0]);
    };

    const renderCharts = (data) => {
        // Hủy biểu đồ cũ nếu có
        ['dept', 'level', 'trend'].forEach(k => charts[k] && charts[k].destroy());

        const lvCount = { 'Nhẹ': 0, 'TB': 0, 'Nặng': 0 };
        const deptCount = {};
        const currentYear = new Date().getFullYear();
        const trend = { [currentYear]: Array(12).fill(0), [currentYear-1]: Array(12).fill(0), [currentYear-2]: Array(12).fill(0) };

        data.forEach(item => {
            // Đếm mức độ
            const m = item["24. Đánh giá ban đầu về mức độ ảnh hưởng"] || "Nhẹ";
            if (m.includes("Nặng")) lvCount['Nặng']++;
            else if (m.includes("TB")) lvCount['TB']++;
            else lvCount['Nhẹ']++;

            // Đếm khoa phòng
            const d = item["5. Đơn vị báo cáo"] || "Khác";
            deptCount[d] = (deptCount[d] || 0) + 1;

            // Xử lý biểu đồ đường (3 năm)
            const dt = parseDate(item["4. Ngày báo cáo"]);
            const y = dt.getFullYear();
            if (trend[y]) trend[y][dt.getMonth()]++;
        });

        // --- BIỂU ĐỒ CỘT (KHOA PHÒNG) ---
        charts.dept = new Chart(document.getElementById('deptChart'), {
            type: 'bar',
            data: {
                labels: Object.keys(deptCount),
                datasets: [{ label: 'Số vụ', data: Object.values(deptCount), backgroundColor: '#2980b9' }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    title: { display: true, text: 'SỰ CỐ THEO KHOA/PHÒNG' },
                    datalabels: { anchor: 'end', align: 'top', font: { weight: 'bold' } }
                }
            }
        });

        // --- BIỂU ĐỒ TRÒN (MỨC ĐỘ) ---
        charts.level = new Chart(document.getElementById('levelChart'), {
            type: 'doughnut',
            data: {
                labels: Object.keys(lvCount),
                datasets: [{ data: Object.values(lvCount), backgroundColor: ['#3498db', '#f39c12', '#e74c3c'] }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    title: { display: true, text: 'TỶ LỆ MỨC ĐỘ ẢNH HƯỞNG' },
                    datalabels: {
                        color: '#fff',
                        font: { weight: 'bold' },
                        formatter: (val, ctx) => {
                            const sum = ctx.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
                            return val > 0 ? `${val} (${(val*100/sum).toFixed(1)}%)` : '';
                        }
                    }
                }
            }
        });

        // --- BIỂU ĐỒ ĐƯỜNG (XU HƯỚNG 3 NĂM) ---
        charts.trend = new Chart(document.getElementById('trendChart'), {
            type: 'line',
            data: {
                labels: ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'],
                datasets: [
                    { label: currentYear-2, data: trend[currentYear-2], borderColor: '#ccc', tension: 0.3 },
                    { label: currentYear-1, data: trend[currentYear-1], borderColor: '#3498db', tension: 0.3 },
                    { label: currentYear, data: trend[currentYear], borderColor: '#e67e22', borderWidth: 3, tension: 0.3 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { title: { display: true, text: 'SO SÁNH XU HƯỚNG 3 NĂM GẦN NHẤT' } }
            }
        });
    };

    const renderTable = (data) => {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = data.map(item => {
            const m = item["24. Đánh giá ban đầu về mức độ ảnh hưởng"] || "Nhẹ";
            const cls = m.includes("Nặng") ? "Nặng" : (m.includes("TB") ? "TB" : "Nhẹ");
            return `<tr>
                <td>${item["4. Ngày báo cáo"] || ""}</td>
                <td>${item["5. Đơn vị báo cáo"] || ""}</td>
                <td>${item["16. Mô tả ngắn gọn"] || ""}</td>
                <td><span class="status-pill status-${cls}">${m}</span></td>
            </tr>`;
        }).join('');
    };

    function filterData() {
        const d = document.getElementById('filterDept').value;
        const l = document.getElementById('filterLevel').value;
        const s = document.getElementById('searchDesc').value.toLowerCase();

        const filtered = originalData.filter(i => {
            return (!d || i["5. Đơn vị báo cáo"] === d) &&
                   (!l || (i["24. Đánh giá ban đầu về mức độ ảnh hưởng"]||"").includes(l)) &&
                   (!s || JSON.stringify(i).toLowerCase().includes(s));
        });
        renderTable(filtered);
        renderCharts(filtered);
    }

    // Tải dữ liệu khi trang mở
    window.onload = () => {
        fetch(scriptURL + '?action=read')
            .then(res => res.json())
            .then(data => {
                originalData = data;
                // Tạo danh sách lọc khoa phòng
                const depts = [...new Set(data.map(i => i["5. Đơn vị báo cáo"]))].filter(x => x).sort();
                const sel = document.getElementById('filterDept');
                depts.forEach(dp => sel.innerHTML += `<option value="${dp}">${dp}</option>`);
                
                renderTable(data);
                renderCharts(data);
            })
            .catch(e => {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="4" style="color:red; text-align:center;">Lỗi: Không thể kết nối dữ liệu. Hãy kiểm tra lại link Web App!</td></tr>`;
            });
    };
</script>
</body>
</html>
