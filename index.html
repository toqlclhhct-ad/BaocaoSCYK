<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Sự cố - Dashboard Thống nhất</title>
    <style>
        :root { --title-color: #2980b9; --bg-body: #f4f7f6; --success-color: #27ae60; --orange-color: #f39c12; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-body); padding: 10px; margin: 0; overflow-x: hidden; }
        .container { max-width: 100%; margin: 0 auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--title-color); margin-bottom: 10px; padding-bottom: 5px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-left h2 { color: var(--title-color); text-transform: uppercase; margin: 0; font-size: 16px; }
        .btn-new { background: var(--success-color); color: white; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 12px; }

        /* Dashboard Layout: Hiển thị đủ trong 1 màn hình */
        .dashboard-grid { display: grid; grid-template-columns: 1.2fr 0.8fr 1fr; gap: 10px; margin-bottom: 10px; }
        .chart-card { background: #fff; padding: 8px; border: 1px solid #eee; border-radius: 8px; height: 220px; position: relative; }
        
        .filter-section { display: flex; flex-wrap: wrap; gap: 8px; background: #f9f9f9; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #eee; }
        .filter-group { display: flex; flex-direction: column; gap: 2px; }
        .filter-group label { font-size: 10px; font-weight: bold; color: #555; }
        .filter-group input, .filter-group select { padding: 4px; border: 1px solid #ccc; border-radius: 4px; font-size: 11px; }

        .table-container { overflow-y: auto; max-height: 300px; border: 1px solid #eee; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { background-color: var(--title-color); color: white; padding: 8px; text-align: left; position: sticky; top: 0; z-index: 5; }
        td { padding: 8px; border-bottom: 1px solid #eee; }

        .status-pill { padding: 2px 6px; border-radius: 10px; font-size: 9px; font-weight: bold; color: white; text-align: center; display: inline-block; min-width: 50px; }
        .status-Nặng { background: #e74c3c; } .status-TB { background: var(--orange-color); } .status-Nhẹ { background: #3498db; }

        .pagination-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding: 5px; }
        .page-nav { display: flex; gap: 4px; }
        .btn-page { padding: 4px 10px; border: 1px solid #ddd; background: white; cursor: pointer; border-radius: 4px; font-size: 11px; }
        .btn-page.active { background: var(--title-color); color: white; border-color: var(--title-color); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-left">
            <img src="https://i.postimg.cc/s2zWMnCs/Logo-Benh-vien.jpg" alt="Logo" style="width: 35px;">
            <h2>Quản lý Sự cố Y khoa</h2>
        </div>
        <a href="form.html" class="btn-new">+ TẠO MỚI</a>
    </header>

    <div class="dashboard-grid">
        <div class="chart-card"><canvas id="deptChart"></canvas></div>
        <div class="chart-card"><canvas id="levelChart"></canvas></div>
        <div class="chart-card"><canvas id="trendChart"></canvas></div>
    </div>

    <div class="filter-section">
        <div class="filter-group"><label>Từ ngày:</label><input type="date" id="startDate"></div>
        <div class="filter-group"><label>Đến ngày:</label><input type="date" id="endDate"></div>
        <div class="filter-group"><label>Khoa:</label><select id="filterDept"><option value="">-- Tất cả --</option></select></div>
        <div class="filter-group"><label>Mức độ:</label><select id="filterLevel"><option value="">-- Tất cả --</option><option value="Nhẹ">Nhẹ</option><option value="TB">TB</option><option value="Nặng">Nặng</option></select></div>
        <div class="filter-group" style="flex-grow: 1;"><label>Tìm kiếm:</label><input type="text" id="searchDesc" placeholder="Nội dung, tên BN..."></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 80px;">Ngày BC</th>
                    <th style="width: 150px;">Khoa/Phòng</th>
                    <th>Mô tả tóm tắt</th>
                    <th style="width: 70px; text-align: center;">Mức độ</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="pagination-bar">
        <div id="pageInfo" style="font-size: 11px; color: #666;"></div>
        <div class="page-nav" id="pageNav"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwsgg3TyHuF60XbkdaHr6uTrXW8akj5Np9f9MjKoC0nNhZoFHnekWpkqpQzAYPpdjQ/exec';
    let originalData = [], filteredData = [], currentPage = 1;
    const rowsPerPage = 10;
    let charts = {};
    const currentYear = new Date().getFullYear();

    document.addEventListener('DOMContentLoaded', async () => {
        ['startDate', 'endDate', 'filterDept', 'filterLevel', 'searchDesc'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => { currentPage = 1; filterData(); });
        });
        await loadData();
    });

    async function loadData() {
        try {
            const res = await fetch(`${scriptURL}?action=read`);
            const raw = await res.json();
            originalData = raw.map(i => {
                const d = parseDate(i.date || "");
                let lv = i.level || "Nhẹ";
                if(lv.includes("Trung bình") || lv === "TB") lv = "TB";
                return { ...i, level: lv, ts: d.getTime(), yr: d.getFullYear(), mo: d.getMonth() };
            });
            filteredData = [...originalData];
            populateDeptFilter(originalData);
            initCharts(originalData);
            renderDisplay();
        } catch (e) { console.error(e); }
    }

    function parseDate(s) {
        const p = s.split('/');
        return p.length === 3 ? new Date(p[2], p[1]-1, p[0]) : new Date();
    }

    function renderDisplay() {
        const start = (currentPage - 1) * rowsPerPage;
        const pageData = filteredData.slice(start, start + rowsPerPage);
        
        document.getElementById('tableBody').innerHTML = pageData.map(row => `
            <tr>
                <td>${row.date}</td>
                <td><b>${row.dept}</b></td>
                <td>${row.desc}</td>
                <td style="text-align: center;"><span class="status-pill status-${row.level}">${row.level}</span></td>
            </tr>`).join('');

        document.getElementById('pageInfo').innerText = `Hiển thị ${pageData.length > 0 ? start + 1 : 0}-${Math.min(start + rowsPerPage, filteredData.length)} / Tổng ${filteredData.length}`;
        renderPagination();
    }

    function renderPagination() {
        const totalPages = Math.ceil(filteredData.length / rowsPerPage);
        const nav = document.getElementById('pageNav');
        nav.innerHTML = '';
        if (totalPages <= 1) return;
        for (let i = 1; i <= totalPages; i++) {
            const btn = document.createElement('button');
            btn.className = `btn-page ${i === currentPage ? 'active' : ''}`;
            btn.innerText = i;
            btn.onclick = () => { currentPage = i; renderDisplay(); };
            nav.appendChild(btn);
        }
    }

    function initCharts(data) {
        const r = getAgg(data);
        Chart.register(ChartDataLabels);

        // 1. Biểu đồ Cột (Chỉ hiện số nguyên dương)
        charts.dept = new Chart(document.getElementById('deptChart'), {
            type: 'bar',
            data: { labels: Object.keys(r.dp), datasets: [{ data: Object.values(r.dp), backgroundColor: '#2980b9' }] },
            options: { 
                responsive: true, maintainAspectRatio: false,
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } } },
                plugins: { legend: false, title: { display: true, text: 'SỰ CỐ THEO ĐƠN VỊ', font: {size: 11} }, datalabels: { anchor: 'end', align: 'top', font: {weight: 'bold'} } }
            }
        });

        // 2. Biểu đồ Tròn
        charts.level = new Chart(document.getElementById('levelChart'), {
            type: 'doughnut',
            data: { labels: ['Nhẹ', 'TB', 'Nặng'], datasets: [{ data: [r.lv['Nhẹ'], r.lv['TB'], r.lv['Nặng']], backgroundColor: ['#3498db', '#f39c12', '#e74c3c'] }] },
            options: { 
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: {size: 10} } }, title: { display: true, text: 'MỨC ĐỘ', font: {size: 11} }, datalabels: { color: '#fff', font: {size: 10} } }
            }
        });

        // 3. Biểu đồ Xu hướng
        charts.trend = new Chart(document.getElementById('trendChart'), {
            type: 'line',
            data: {
                labels: ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'],
                datasets: [{ label: currentYear, data: r.tr[currentYear], borderColor: '#e67e22', tension: 0.3, fill: false }]
            },
            options: { 
                responsive: true, maintainAspectRatio: false,
                scales: { y: { ticks: { stepSize: 1, precision: 0 } } },
                plugins: { title: { display: true, text: 'XU HƯỚNG NĂM ' + currentYear, font: {size: 11} }, datalabels: false }
            }
        });
    }

    function filterData() {
        const s = document.getElementById('searchDesc').value.toLowerCase(), d = document.getElementById('filterDept').value, l = document.getElementById('filterLevel').value, start = document.getElementById('startDate').value, end = document.getElementById('endDate').value;
        const st = start ? new Date(start).getTime() : 0, et = end ? new Date(end).setHours(23,59,59) : Infinity;

        filteredData = originalData.filter(i => (i.ts >= st && i.ts <= et) && (d==="" || i.dept===d) && (l==="" || i.level===l) && (i.desc.toLowerCase().includes(s) || i.dept.toLowerCase().includes(s)));
        
        renderDisplay();
        const r = getAgg(filteredData);
        charts.dept.data.labels = Object.keys(r.dp);
        charts.dept.data.datasets[0].data = Object.values(r.dp);
        charts.level.data.datasets[0].data = [r.lv['Nhẹ'], r.lv['TB'], r.lv['Nặng']];
        charts.trend.data.datasets[0].data = r.tr[currentYear];
        Object.values(charts).forEach(c => c.update('none'));
    }

    function getAgg(data) {
        const lv = { 'Nhẹ': 0, 'TB': 0, 'Nặng': 0 }, dp = {}, tr = {[currentYear]: Array(12).fill(0)};
        data.forEach(i => {
            if(lv.hasOwnProperty(i.level)) lv[i.level]++;
            dp[i.dept] = (dp[i.dept] || 0) + 1;
            if(tr[i.yr]) tr[i.yr][i.mo]++;
        });
        return { lv, dp, tr };
    }

    function populateDeptFilter(data) {
        const depts = [...new Set(data.map(i => i.dept))].filter(Boolean).sort();
        document.getElementById('filterDept').innerHTML = '<option value="">-- Tất cả --</option>' + depts.map(d => `<option value="${d}">${d}</option>`).join('');
    }
</script>
</body>
</html>
