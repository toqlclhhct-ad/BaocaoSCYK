<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Sự cố - Dashboard</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <style>
        :root { --title-color: #2980b9; --bg-body: #f4f7f6; --success-color: #27ae60; --orange-color: #f39c12; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-body); padding: 15px; margin: 0; }
        .container { max-width: 1300px; margin: 10px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--title-color); margin-bottom: 20px; padding-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-left h2 { color: var(--title-color); text-transform: uppercase; margin: 0; font-size: 16px; }
        .btn-new { background: var(--success-color); color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; font-size: 13px; transition: 0.3s; }

        .dashboard-top { display: grid; grid-template-columns: 2fr 1fr; gap: 15px; margin-bottom: 15px; }
        .chart-card { background: #fff; padding: 15px; border-radius: 10px; border: 1px solid #eee; height: 300px; position: relative; }
        .full-width { width: 100%; height: 320px; margin-bottom: 20px; }
        
        .filter-section { display: flex; flex-wrap: wrap; gap: 10px; background: #f9f9f9; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #eee; }
        .filter-group { display: flex; flex-direction: column; gap: 4px; }
        .filter-group label { font-size: 11px; font-weight: bold; color: #555; }
        .filter-group input, .filter-group select { padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
        
        .table-container { overflow-x: auto; max-height: 450px; border: 1px solid #eee; border-radius: 8px; background: #fff; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background-color: var(--title-color); color: white; padding: 12px 10px; text-align: left; position: sticky; top: 0; z-index: 5; }
        td { padding: 12px 10px; border-bottom: 1px solid #eee; }

        /* Pagination Styles */
        .pagination-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding: 10px; background: #fff; border-radius: 8px; border: 1px solid #eee; }
        .page-info { font-size: 13px; color: #666; }
        .page-nav { display: flex; gap: 5px; }
        .btn-page { padding: 5px 12px; border: 1px solid #ddd; background: white; cursor: pointer; border-radius: 4px; font-size: 12px; }
        .btn-page.active { background: var(--title-color); color: white; border-color: var(--title-color); font-weight: bold; }

        .status-pill { padding: 3px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; color: white; display: inline-block; min-width: 55px; text-align: center; }
        .status-Nặng { background: #e74c3c; } .status-TB { background: var(--orange-color); } .status-Nhẹ { background: #3498db; }

        @media (max-width: 992px) { .dashboard-top { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-left">
            <img src="https://i.postimg.cc/s2zWMnCs/Logo-Benh-vien.jpg" alt="Logo" style="width: 40px;">
            <h2>Hệ thống Quản lý Sự cố Y khoa</h2>
        </div>
        <a href="form.html" class="btn-new">+ TẠO MỚI</a>
    </header>

    <div class="dashboard-top">
        <div class="chart-card"><canvas id="deptChart"></canvas></div>
        <div class="chart-card"><canvas id="levelChart"></canvas></div>
    </div>
    
    <div class="chart-card full-width"><canvas id="trendChart"></canvas></div>

    <div class="filter-section">
        <div class="filter-group"><label>Từ ngày:</label><input type="date" id="startDate"></div>
        <div class="filter-group"><label>Đến ngày:</label><input type="date" id="endDate"></div>
        <div class="filter-group"><label>Khoa:</label><select id="filterDept"><option value="">-- Tất cả --</option></select></div>
        <div class="filter-group"><label>Mức độ:</label><select id="filterLevel"><option value="">-- Tất cả --</option><option value="Nhẹ">Nhẹ</option><option value="TB">TB</option><option value="Nặng">Nặng</option></select></div>
        <div class="filter-group" style="flex-grow: 1;"><label>Tìm kiếm theo Mô tả:</label><input type="text" id="searchDesc" placeholder="Tìm theo tên BN, nội dung..."></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 90px;">Ngày BC</th>
                    <th style="width: 180px;">Khoa/Phòng</th>
                    <th>Mô tả tóm tắt</th>
                    <th style="width: 80px; text-align: center;">Mức độ</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="4" style="text-align:center; padding: 20px;">Đang tải dữ liệu...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="pagination-bar">
        <div class="page-info" id="pageInfo">Đang xử lý...</div>
        <div class="page-nav" id="pageNav"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwsgg3TyHuF60XbkdaHr6uTrXW8akj5Np9f9MjKoC0nNhZoFHnekWpkqpQzAYPpdjQ/exec';
    let originalData = [], filteredData = [];
    let currentPage = 1;
    const rowsPerPage = 10;
    let deptChart, levelChart, trendChart;
    const currentYear = new Date().getFullYear();

    document.addEventListener('DOMContentLoaded', async () => {
        setupListeners();
        await loadData();
    });

    async function loadData() {
        try {
            const res = await fetch(`${scriptURL}?action=read`);
            const raw = await res.json();
            
            originalData = raw.map(i => {
                // Ánh xạ dữ liệu dựa trên danh sách 30 cột của bạn
                // i.date = Cột 4 (Ngày báo cáo), i.dept = Cột 12 (Khoa xảy ra), i.desc = Cột 16 (Mô tả), i.level = Cột 24 (Đánh giá)
                const d = parseDate(i.date || "");
                
                // Chuẩn hóa mức độ để đồng nhất biểu đồ và CSS
                let lv = i.level || "Nhẹ";
                if(lv.includes("Trung bình") || lv === "TB") lv = "TB";
                if(lv.includes("Nặng")) lv = "Nặng";

                return {
                    ...i,
                    level: lv,
                    patientName: i.patientName || "", // Cột 6: Họ và tên BN (Dùng cho tìm kiếm)
                    ts: d.getTime(), 
                    yr: d.getFullYear(), 
                    mo: d.getMonth() 
                };
            });

            filteredData = [...originalData];
            populateDeptFilter(originalData);
            initCharts(originalData);
            renderDisplay();
        } catch (e) {
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="4" style="color:red; text-align:center;">Không thể tải dữ liệu. Hãy kiểm tra lại URL App Script.</td></tr>';
        }
    }

    function setupListeners() {
        ['startDate', 'endDate', 'filterDept', 'filterLevel', 'searchDesc'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                currentPage = 1; // Reset về trang 1 khi lọc
                filterData();
            });
        });
    }

    function parseDate(s) {
        if(!s || typeof s !== 'string') return new Date();
        const p = s.split('/');
        return p.length === 3 ? new Date(p[2], p[1]-1, p[0]) : new Date();
    }

    function filterData() {
        const s = document.getElementById('searchDesc').value.toLowerCase();
        const d = document.getElementById('filterDept').value;
        const l = document.getElementById('filterLevel').value;
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        const st = start ? new Date(start).getTime() : 0;
        const et = end ? new Date(end).setHours(23,59,59,999) : Infinity;

        filteredData = originalData.filter(i => 
            (i.ts >= st && i.ts <= et) &&
            (d === "" || i.dept === d) &&
            (l === "" || i.level === l) &&
            (i.desc.toLowerCase().includes(s) || i.dept.toLowerCase().includes(s) || (i.patientName && i.patientName.toLowerCase().includes(s)))
        );

        renderDisplay();
        updateCharts();
    }

    function renderDisplay() {
        const tbody = document.getElementById('tableBody');
        const start = (currentPage - 1) * rowsPerPage;
        const end = start + rowsPerPage;
        const pageData = filteredData.slice(start, end);

        tbody.innerHTML = pageData.map(row => `
            <tr>
                <td>${row.date}</td>
                <td><b>${row.dept}</b></td>
                <td>${row.desc}</td>
                <td style="text-align: center;"><span class="status-pill status-${row.level}">${row.level}</span></td>
            </tr>
        `).join('') || '<tr><td colspan="4" style="text-align:center;">Không tìm thấy dữ liệu phù hợp.</td></tr>';

        // Cập nhật thông tin số trang
        document.getElementById('pageInfo').innerText = `Hiển thị ${pageData.length > 0 ? start + 1 : 0} - ${Math.min(end, filteredData.length)} của ${filteredData.length} sự cố`;
        renderPaginationButtons();
    }

    function renderPaginationButtons() {
        const totalPages = Math.ceil(filteredData.length / rowsPerPage);
        const nav = document.getElementById('pageNav');
        nav.innerHTML = '';
        if (totalPages <= 1) return;

        for (let i = 1; i <= totalPages; i++) {
            const btn = document.createElement('button');
            btn.className = `btn-page ${i === currentPage ? 'active' : ''}`;
            btn.innerText = i;
            btn.onclick = () => { currentPage = i; renderDisplay(); };
            nav.appendChild(btn);
        }
    }

    function getAgg(data) {
        const lv = { 'Nhẹ': 0, 'TB': 0, 'Nặng': 0 }, dp = {}, tr = {[currentYear]: Array(12).fill(0), [currentYear-1]: Array(12).fill(0), [currentYear-2]: Array(12).fill(0)};
        data.forEach(i => {
            if(lv.hasOwnProperty(i.level)) lv[i.level]++;
            dp[i.dept] = (dp[i.dept] || 0) + 1;
            if(tr[i.yr]) tr[i.yr][i.mo]++;
        });
        return { lv, dp, tr };
    }

    function initCharts(data) {
        const r = getAgg(data);
        Chart.register(ChartDataLabels);

        deptChart = new Chart(document.getElementById('deptChart'), {
            type: 'bar',
            data: { labels: Object.keys(r.dp), datasets: [{ data: Object.values(r.dp), backgroundColor: '#2980b9' }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: false, title: { display: true, text: 'SỐ LƯỢNG THEO KHOA/PHÒNG' } } }
        });

        levelChart = new Chart(document.getElementById('levelChart'), {
            type: 'doughnut',
            data: { labels: ['Nhẹ', 'TB', 'Nặng'], datasets: [{ data: [r.lv['Nhẹ'], r.lv['TB'], r.lv['Nặng']], backgroundColor: ['#3498db', '#f39c12', '#e74c3c'] }] },
            options: { responsive: true, maintainAspectRatio: false, cutout: '65%', plugins: { legend: { position: 'bottom' }, datalabels: { color: '#fff', formatter: (v, ctx) => { const s = ctx.dataset.data.reduce((a,b)=>a+b,0); return v > 0 ? `${v}\n(${(v*100/s).toFixed(0)}%)` : ''; }, textAlign: 'center' } } }
        });

        trendChart = new Chart(document.getElementById('trendChart'), {
            type: 'line',
            data: {
                labels: ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'],
                datasets: [
                    { label: currentYear-2, data: r.tr[currentYear-2], borderColor: '#ccc', tension: 0.3 },
                    { label: currentYear-1, data: r.tr[currentYear-1], borderColor: '#3498db', tension: 0.3 },
                    { label: currentYear, data: r.tr[currentYear], borderColor: '#e67e22', borderWidth: 3, tension: 0.3 }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { datalabels: false } }
        });
    }

    function updateCharts() {
        const r = getAgg(filteredData);
        deptChart.data.labels = Object.keys(r.dp);
        deptChart.data.datasets[0].data = Object.values(r.dp);
        levelChart.data.datasets[0].data = [r.lv['Nhẹ'], r.lv['TB'], r.lv['Nặng']];
        trendChart.data.datasets[0].data = r.tr[currentYear-2];
        trendChart.data.datasets[1].data = r.tr[currentYear-1];
        trendChart.data.datasets[2].data = r.tr[currentYear];
        [deptChart, levelChart, trendChart].forEach(c => c.update('none'));
    }

    function populateDeptFilter(data) {
        const depts = [...new Set(data.map(i => i.dept))].filter(Boolean).sort();
        document.getElementById('filterDept').innerHTML = '<option value="">-- Tất cả --</option>' + depts.map(d => `<option value="${d}">${d}</option>`).join('');
    }
</script>
</body>
</html>
