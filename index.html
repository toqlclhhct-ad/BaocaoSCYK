<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Sự cố - Full Data & Pagination</title>
    <style>
        :root { --title-color: #2980b9; --bg-body: #f4f7f6; --success-color: #27ae60; --orange-color: #f39c12; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-body); padding: 10px; margin: 0; }
        .container { max-width: 1500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--title-color); margin-bottom: 15px; padding-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-left h2 { color: var(--title-color); text-transform: uppercase; margin: 0; font-size: 18px; }
        .btn-new { background: var(--success-color); color: white; text-decoration: none; padding: 8px 18px; border-radius: 6px; font-weight: bold; font-size: 14px; }

        .dashboard-top { display: grid; grid-template-columns: 2fr 1fr; gap: 15px; margin-bottom: 15px; }
        .chart-card { background: #fff; padding: 10px; border-radius: 10px; border: 1px solid #eee; height: 260px; }
        .trend-card { width: 100%; height: 240px; margin-bottom: 15px; padding: 10px; border: 1px solid #eee; border-radius: 10px; }
        
        .filter-section { display: flex; flex-wrap: wrap; gap: 10px; background: #f9f9f9; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #eee; }
        .filter-group { display: flex; flex-direction: column; gap: 4px; }
        .filter-group label { font-size: 11px; font-weight: bold; color: #555; }
        .filter-group input, .filter-group select { padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        
        .table-container { overflow-y: auto; height: calc(100vh - 650px); min-height: 400px; border: 1px solid #eee; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { background-color: var(--title-color); color: white; padding: 12px 10px; text-align: left; position: sticky; top: 0; z-index: 10; }
        td { padding: 12px 10px; border-bottom: 1px solid #f0f0f0; }

        .pagination-container { display: flex; justify-content: space-between; align-items: center; padding: 15px 10px; background: #fff; border-top: 1px solid #eee; }
        .page-info { font-size: 13px; color: #666; }
        .page-nav { display: flex; gap: 5px; }
        .btn-page { padding: 6px 12px; border: 1px solid #ddd; background: white; cursor: pointer; border-radius: 4px; font-size: 13px; }
        .btn-page.active { background: var(--title-color); color: white; border-color: var(--title-color); font-weight: bold; }
        .btn-page:disabled { color: #ccc; cursor: not-allowed; }

        .status-pill { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; color: white; display: inline-block; min-width: 65px; text-align: center; }
        .status-Nặng { background: #e74c3c; } .status-TB { background: var(--orange-color); } .status-Nhẹ { background: #3498db; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-left">
            <img src="https://i.postimg.cc/s2zWMnCs/Logo-Benh-vien.jpg" alt="Logo" style="width: 40px;">
            <h2>Hệ thống Quản lý Sự cố y khoa</h2>
        </div>
        <a href="form.html" class="btn-new">+ TẠO MỚI</a>
    </header>

    <div class="dashboard-top">
        <div class="chart-card"><canvas id="deptChart"></canvas></div>
        <div class="chart-card"><canvas id="levelChart"></canvas></div>
    </div>
    <div class="trend-card"><canvas id="trendChart"></canvas></div>

    <div class="filter-section">
        <div class="filter-group"><label>Từ ngày:</label><input type="date" id="startDate"></div>
        <div class="filter-group"><label>Đến ngày:</label><input type="date" id="endDate"></div>
        <div class="filter-group"><label>Khoa:</label><select id="filterDept"><option value="">-- Tất cả khoa --</option></select></div>
        <div class="filter-group"><label>Mức độ:</label><select id="filterLevel"><option value="">-- Tất cả --</option><option value="Nhẹ">Nhẹ</option><option value="TB">TB</option><option value="Nặng">Nặng</option></select></div>
        <div class="filter-group" style="flex-grow: 1;"><label>Tìm kiếm theo mô tả:</label><input type="text" id="searchDesc" placeholder="Từ khóa nội dung..."></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 100px;">Ngày BC</th>
                    <th style="width: 200px;">Khoa/Phòng</th>
                    <th>Mô tả chi tiết sự cố</th>
                    <th style="width: 100px; text-align: center;">Mức độ</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="pagination-container">
        <div class="page-info" id="pageInfo">Đang nạp dữ liệu...</div>
        <div class="page-nav" id="pageNav"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbynaVlHpUE79D4fnczE04D_r83k0F3d_V4YBRVwOsWfhbWv47rdiGomoqQAdtX784U/exec';
    let originalData = [], filteredData = [];
    let currentPage = 1;
    const rowsPerPage = 10;
    let deptChart, levelChart, trendChart;

    document.addEventListener('DOMContentLoaded', async () => {
        await loadData();
        setupListeners();
    });

    async function loadData() {
        try {
            const res = await fetch(`${scriptURL}?action=read`);
            const raw = await res.json();
            const currentYear = new Date().getFullYear();

            // Sửa lỗi undefined bằng cách kiểm tra kỹ tên thuộc tính
            originalData = raw.map(i => {
                const dateVal = i.date || i.Ngày || "";
                const deptVal = i.dept || i.Khoa || i["Khoa/Phòng"] || "";
                const descVal = i.desc || i["Mô tả"] || i["Mô tả chi tiết sự cố"] || "";
                const levelVal = (i.level === "Trung bình" || i.level === "TB") ? "TB" : (i.level || "Nhẹ");
                
                const d = parseDate(dateVal);
                return { 
                    date: dateVal, 
                    dept: deptVal, 
                    desc: descVal, 
                    level: levelVal,
                    ts: d.getTime(), 
                    yr: d.getFullYear(), 
                    mo: d.getMonth() 
                };
            });

            filteredData = [...originalData];
            populateDeptFilter(originalData);
            initCharts(originalData);
            renderDisplay();
        } catch (e) {
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="4" style="color:red; text-align:center;">Lỗi kết nối: Vui lòng kiểm tra Deployment URL!</td></tr>';
        }
    }

    function setupListeners() {
        ['startDate', 'endDate', 'filterDept', 'filterLevel', 'searchDesc'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                currentPage = 1;
                filterLogic();
            });
        });
    }

    function parseDate(s) {
        if(!s || typeof s !== 'string') return new Date();
        const p = s.split('/');
        return p.length === 3 ? new Date(p[2], p[1]-1, p[0]) : new Date();
    }

    function filterLogic() {
        const s = document.getElementById('searchDesc').value.toLowerCase();
        const d = document.getElementById('filterDept').value;
        const l = document.getElementById('filterLevel').value;
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        const st = start ? new Date(start).getTime() : 0;
        const et = end ? new Date(end).setHours(23,59,59,999) : Infinity;

        filteredData = originalData.filter(i => 
            (i.ts >= st && i.ts <= et) &&
            (d === "" || i.dept === d) &&
            (l === "" || i.level === l) &&
            (i.desc.toLowerCase().includes(s) || i.dept.toLowerCase().includes(s))
        );
        renderDisplay();
        updateCharts(filteredData);
    }

    function renderDisplay() {
        const tbody = document.getElementById('tableBody');
        const start = (currentPage - 1) * rowsPerPage;
        const end = start + rowsPerPage;
        const pageData = filteredData.slice(start, end);

        tbody.innerHTML = pageData.map(row => `
            <tr>
                <td>${row.date}</td>
                <td>${row.dept}</td>
                <td>${row.desc}</td>
                <td style="text-align: center;"><span class="status-pill status-${row.level}">${row.level}</span></td>
            </tr>
        `).join('') || '<tr><td colspan="4" style="text-align:center;">Không có dữ liệu phù hợp.</td></tr>';

        document.getElementById('pageInfo').innerText = `Hiển thị ${pageData.length > 0 ? start + 1 : 0} - ${Math.min(end, filteredData.length)} trên tổng số ${filteredData.length} sự cố`;
        renderPaginationButtons();
    }

    function renderPaginationButtons() {
        const totalPages = Math.ceil(filteredData.length / rowsPerPage);
        const nav = document.getElementById('pageNav');
        nav.innerHTML = '';
        if (totalPages <= 1) return;

        for (let i = 1; i <= totalPages; i++) {
            const btn = document.createElement('button');
            btn.className = `btn-page ${i === currentPage ? 'active' : ''}`;
            btn.innerText = i;
            btn.onclick = () => { currentPage = i; renderDisplay(); document.querySelector('.table-container').scrollTop = 0; };
            nav.appendChild(btn);
        }
    }

    // --- Giữ nguyên các hàm Chart như cũ ---
    function initCharts(data) {
        const yr = new Date().getFullYear();
        Chart.register(ChartDataLabels);
        const r = getAgg(data, yr);
        deptChart = new Chart(document.getElementById('deptChart'), { type: 'bar', data: { labels: Object.keys(r.dp), datasets: [{ data: Object.values(r.dp), backgroundColor: '#2980b9' }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { ticks: { stepSize: 1 } } }, plugins: { legend: false, title: { display: true, text: 'SỐ VỤ THEO KHOA/PHÒNG' } } } });
        levelChart = new Chart(document.getElementById('levelChart'), { type: 'doughnut', data: { labels: ['Nhẹ', 'TB', 'Nặng'], datasets: [{ data: [r.lv.Nhẹ, r.lv.TB, r.lv.Nặng], backgroundColor: ['#3498db', '#f39c12', '#e74c3c'] }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '65%', plugins: { legend: { position: 'bottom' }, datalabels: { color: '#fff', formatter: (v, ctx) => { const s = ctx.dataset.data.reduce((a,b)=>a+b,0); return v > 0 ? `${v}\n(${(v*100/s).toFixed(0)}%)` : ''; }, textAlign: 'center' } } } });
        trendChart = new Chart(document.getElementById('trendChart'), { type: 'line', data: { labels: ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'], datasets: [{ label: yr-2, data: r.tr[yr-2], borderColor: '#ccc', tension: 0.3 }, { label: yr-1, data: r.tr[yr-1], borderColor: '#3498db', tension: 0.3 }, { label: yr, data: r.tr[yr], borderColor: '#e67e22', borderWidth: 3, tension: 0.3 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { datalabels: false, title: { display: true, text: 'XU HƯỚNG 3 NĂM' } } } });
    }

    function updateCharts(data) {
        const yr = new Date().getFullYear();
        const r = getAgg(data, yr);
        deptChart.data.labels = Object.keys(r.dp);
        deptChart.data.datasets[0].data = Object.values(r.dp);
        levelChart.data.datasets[0].data = [r.lv.Nhẹ, r.lv.TB, r.lv.Nặng];
        trendChart.data.datasets[0].data = r.tr[yr-2];
        trendChart.data.datasets[1].data = r.tr[yr-1];
        trendChart.data.datasets[2].data = r.tr[yr];
        [deptChart, levelChart, trendChart].forEach(c => c.update('none'));
    }

    function getAgg(data, yr) {
        const lv = { Nhẹ: 0, TB: 0, Nặng: 0 }, dp = {}, tr = { [yr]: Array(12).fill(0), [yr-1]: Array(12).fill(0), [yr-2]: Array(12).fill(0) };
        data.forEach(i => { if(lv.hasOwnProperty(i.level)) lv[i.level]++; dp[i.dept] = (dp[i.dept] || 0) + 1; if(tr[i.yr]) tr[i.yr][i.mo]++; });
        return { lv, dp, tr };
    }

    function populateDeptFilter(data) {
        const depts = [...new Set(data.map(i => i.dept))].filter(Boolean).sort();
        document.getElementById('filterDept').innerHTML = '<option value="">-- Tất cả khoa --</option>' + depts.map(d => `<option value="${d}">${d}</option>`).join('');
    }
</script>
</body>
</html>
