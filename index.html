<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Sự cố Y khoa</title>
    <style>
        :root { --primary: #2980b9; --bg: #f4f7f6; --success: #27ae60; --orange: #f39c12; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1400px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--primary); padding-bottom: 15px; }
        .btn-create { background: var(--success); color: white; padding: 10px 22px; text-decoration: none; border-radius: 6px; font-weight: bold; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-create:hover { background: #219150; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(39,174,96,0.3); }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .chart-card { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 15px; height: 350px; }
        .full-width { grid-column: span 2; height: 400px; }

        .filter-section { display: flex; flex-wrap: wrap; gap: 12px; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #eee; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 12px; font-weight: bold; color: #666; }
        .filter-group input, .filter-group select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; outline: none; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: var(--primary); color: white; padding: 14px 12px; text-align: left; position: sticky; top: 0; z-index: 10; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f1f7ff; }
        
        .status-pill { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; color: white; text-transform: uppercase; }
        .status-Nặng { background: #e74c3c; } 
        .status-TB { background: var(--orange); } 
        .status-Nhẹ { background: #3498db; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="https://i.postimg.cc/s2zWMnCs/Logo-Benh-vien.jpg" alt="Logo" style="height: 55px;">
            <div>
                <h2 style="color: var(--primary); margin: 0; font-size: 22px;">HỆ THỐNG QUẢN LÝ SỰ CỐ Y KHOA</h2>
                <small style="color: #666;">Dữ liệu cập nhật thời gian thực từ Google Sheets</small>
            </div>
        </div>
        <a href="form.html" class="btn-create"><span>+</span> TẠO MỚI</a>
    </header>

    <div class="dashboard-grid">
        <div class="chart-card"><canvas id="deptChart"></canvas></div>
        <div class="chart-card"><canvas id="levelChart"></canvas></div>
        <div class="chart-card full-width"><canvas id="trendChart"></canvas></div>
    </div>

    <div class="filter-section">
        <div class="filter-group"><label>Khoa/Phòng:</label><select id="filterDept" onchange="filterData()"><option value="">-- Tất cả đơn vị --</option></select></div>
        <div class="filter-group"><label>Mức độ:</label><select id="filterLevel" onchange="filterData()"><option value="">-- Tất cả mức độ --</option><option value="Nhẹ">Nhẹ</option><option value="TB">TB</option><option value="Nặng">Nặng</option></select></div>
        <div class="filter-group" style="flex-grow: 1;"><label>Tìm kiếm nhanh:</label><input type="text" id="searchDesc" placeholder="Nội dung sự cố, tên bệnh nhân, số báo cáo..." onkeyup="filterData()"></div>
    </div>

    <div style="overflow-x: auto; max-height: 500px; border: 1px solid #ddd; border-radius: 8px;">
        <table>
            <thead>
                <tr>
                    <th style="width: 100px;">Ngày BC</th>
                    <th style="width: 220px;">Đơn vị báo cáo</th>
                    <th>Mô tả tóm tắt sự cố</th>
                    <th style="width: 110px;">Mức độ</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="4" style="text-align: center; padding: 40px; color: #999;">Đang tải dữ liệu từ máy chủ...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwhddoy_kv6FaHQHV-LM4pHnCvhiCnW1SQpf2hZGOjAmA7EPgx-0EE8j43SgPDa_5A/exec';
    let originalData = [];
    let charts = {};

    Chart.register(ChartDataLabels);

    // HÀM QUAN TRỌNG: Chuyển đổi dd/mm/yyyy sang đối tượng Date chuẩn
    const parseVNDate = (dateStr) => {
        if (!dateStr || typeof dateStr !== 'string' || !dateStr.includes('/')) return new Date(0);
        const parts = dateStr.split('/');
        // parts[0] = dd, parts[1] = mm, parts[2] = yyyy
        return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
    };

    const renderCharts = (data) => {
        ['dept', 'level', 'trend'].forEach(k => charts[k] && charts[k].destroy());

        const lvCount = { 'Nhẹ': 0, 'TB': 0, 'Nặng': 0 };
        const deptCount = {};
        const currentYear = new Date().getFullYear();
        const trend = { [currentYear]: Array(12).fill(0), [currentYear-1]: Array(12).fill(0), [currentYear-2]: Array(12).fill(0) };

        data.forEach(item => {
            // Xử lý mức độ
            const m = item["24. Đánh giá ban đầu về mức độ ảnh hưởng"] || "";
            if (m.includes("Nặng")) lvCount['Nặng']++;
            else if (m.includes("TB") || m.includes("Trung bình")) lvCount['TB']++;
            else if (m.includes("Nhẹ")) lvCount['Nhẹ']++;

            // Xử lý khoa phòng
            const d = item["5. Đơn vị báo cáo"] || "Khác";
            deptCount[d] = (deptCount[d] || 0) + 1;

            // Xử lý xu hướng 3 năm (sử dụng parseVNDate)
            const dt = parseVNDate(item["4. Ngày báo cáo"]);
            const y = dt.getFullYear();
            if (trend[y]) trend[y][dt.getMonth()]++;
        });

        // 1. BIỂU ĐỒ CỘT
        charts.dept = new Chart(document.getElementById('deptChart'), {
            type: 'bar',
            data: {
                labels: Object.keys(deptCount),
                datasets: [{ label: 'Số vụ', data: Object.values(deptCount), backgroundColor: '#2980b9' }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    title: { display: true, text: 'PHÂN BỐ SỰ CỐ THEO KHOA/PHÒNG' },
                    datalabels: { anchor: 'end', align: 'top', font: { weight: 'bold' }, color: '#444' }
                }
            }
        });

        // 2. BIỂU ĐỒ TRÒN
        charts.level = new Chart(document.getElementById('levelChart'), {
            type: 'doughnut',
            data: {
                labels: ['Nhẹ', 'TB', 'Nặng'],
                datasets: [{ 
                    data: [lvCount['Nhẹ'], lvCount['TB'], lvCount['Nặng']], 
                    backgroundColor: ['#3498db', '#f39c12', '#e74c3c'] 
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    title: { display: true, text: 'TỶ LỆ MỨC ĐỘ ẢNH HƯỞNG' },
                    datalabels: {
                        color: '#fff', font: { weight: 'bold' },
                        formatter: (val, ctx) => {
                            const sum = ctx.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
                            return val > 0 ? `${val} (${(val*100/sum).toFixed(1)}%)` : '';
                        }
                    }
                }
            }
        });

        // 3. BIỂU ĐỒ ĐƯỜNG (XU HƯỚNG 3 NĂM)
        charts.trend = new Chart(document.getElementById('trendChart'), {
            type: 'line',
            data: {
                labels: ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'],
                datasets: [
                    { label: 'Năm ' + (currentYear-2), data: trend[currentYear-2], borderColor: '#bdc3c7', tension: 0.3, pointRadius: 4 },
                    { label: 'Năm ' + (currentYear-1), data: trend[currentYear-1], borderColor: '#3498db', tension: 0.3, pointRadius: 4 },
                    { label: 'Năm ' + currentYear, data: trend[currentYear], borderColor: '#e67e22', borderWidth: 4, tension: 0.3, pointRadius: 5 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: { 
                    title: { display: true, text: 'XU HƯỚNG TỔNG HỢP 3 NĂM GẦN NHẤT' },
                    datalabels: { display: false } // Tắt số trên đường cho đỡ rối
                },
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
            }
        });
    };

    const renderTable = (data) => {
        const tbody = document.getElementById('tableBody');
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px;">Không tìm thấy kết quả phù hợp</td></tr>';
            return;
        }
        tbody.innerHTML = data.map(item => {
            let m = item["24. Đánh giá ban đầu về mức độ ảnh hưởng"] || "Nhẹ";
            if (m.includes("Trung bình")) m = "TB";
            const cls = m.includes("Nặng") ? "Nặng" : (m.includes("TB") ? "TB" : "Nhẹ");
            return `<tr>
                <td><b>${item["4. Ngày báo cáo"] || ""}</b></td>
                <td>${item["5. Đơn vị báo cáo"] || ""}</td>
                <td>${item["16. Mô tả ngắn gọn"] || ""}</td>
                <td><span class="status-pill status-${cls}">${m}</span></td>
            </tr>`;
        }).join('');
    };

    function filterData() {
        const d = document.getElementById('filterDept').value;
        const l = document.getElementById('filterLevel').value;
        const s = document.getElementById('searchDesc').value.toLowerCase();

        const filtered = originalData.filter(i => {
            const itemLevel = i["24. Đánh giá ban đầu về mức độ ảnh hưởng"] || "";
            const matchLevel = !l || (l === "TB" ? (itemLevel.includes("TB") || itemLevel.includes("Trung bình")) : itemLevel.includes(l));
            const matchSearch = !s || JSON.stringify(i).toLowerCase().includes(s);
            const matchDept = !d || i["5. Đơn vị báo cáo"] === d;
            return matchDept && matchLevel && matchSearch;
        });
        renderTable(filtered);
        renderCharts(filtered);
    }

    window.onload = () => {
        fetch(scriptURL + '?action=read')
            .then(res => res.json())
            .then(data => {
                originalData = data;
                // Sắp xếp dữ liệu theo ngày mới nhất lên đầu bảng
                originalData.sort((a, b) => parseVNDate(b["4. Ngày báo cáo"]) - parseVNDate(a["4. Ngày báo cáo"]));
                
                const depts = [...new Set(data.map(i => i["5. Đơn vị báo cáo"]))].filter(x => x).sort();
                const sel = document.getElementById('filterDept');
                depts.forEach(dp => sel.innerHTML += `<option value="${dp}">${dp}</option>`);
                
                renderTable(originalData);
                renderCharts(originalData);
            })
            .catch(e => {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="4" style="color:red; text-align:center;">Lỗi kết nối: ${e.message}</td></tr>`;
            });
    };
</script>
</body>
</html>
