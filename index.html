<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Sự cố - Bệnh viện</title>
    <style>
        :root { --primary: #2980b9; --bg: #f4f7f6; --success: #27ae60; --orange: #f39c12; --danger: #e74c3c; --ai-purple: #8e44ad; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 1600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 15px; }
        .btn-new { background: var(--success); color: white; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; font-size: 14px; }
        
        .dashboard-grid { display: grid; grid-template-columns: 1fr 0.8fr 1.2fr; gap: 15px; margin-bottom: 20px; }
        .card { background: #fff; padding: 15px; border-radius: 10px; border: 1px solid #eee; height: 250px; position: relative; }
        
        .filters { display: flex; flex-wrap: wrap; gap: 12px; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #eee; }
        .f-group { display: flex; flex-direction: column; gap: 5px; }
        .f-group label { font-size: 12px; font-weight: bold; color: #666; }
        .f-group input, .f-group select { padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }

        .table-area { overflow-x: auto; border: 1px solid #eee; border-radius: 8px; margin-bottom: 10px; height: 500px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 800px; }
        th { background: var(--primary); color: white; padding: 12px; text-align: left; position: sticky; top: 0; z-index: 5; }
        td { padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        tr:hover { background: #f1f7ff; }

        .pill { padding: 4px 10px; border-radius: 20px; color: white; font-weight: bold; font-size: 11px; }
        .status-Nhẹ { background: #3498db; }
        .status-TB { background: var(--orange); }
        .status-Nặng { background: var(--danger); }

        /* MODAL */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .modal-content { background: white; margin: 1% auto; width: 95%; max-width: 1200px; border-radius: 12px; max-height: 95vh; overflow-y: auto; display: flex; flex-direction: column; }
        .modal-header { padding: 15px 20px; border-bottom: 2px solid var(--primary); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: white; z-index: 11; }
        .close { font-size: 30px; cursor: pointer; color: #666; }

        .detail-body { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; padding: 20px; }
        .info-panel { border-right: 1px solid #eee; padding-right: 20px; }
        .ai-panel { background: #fcfaff; border-radius: 10px; padding: 20px; border: 1px solid #e0d0f0; height: fit-content; position: sticky; top: 20px; }

        .detail-item { border-bottom: 1px solid #f5f5f5; padding: 8px 0; font-size: 13px; line-height: 1.4; }
        .detail-label { font-weight: bold; color: var(--primary); margin-right: 8px; }

        .btn-ai { background: var(--ai-purple); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 15px; margin-bottom: 20px; }
        .btn-ai:disabled { background: #bdc3c7; }
        
        .ai-box { background: white; border-left: 4px solid var(--ai-purple); padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .progress-bar { height: 10px; background: #eee; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--success); width: 0%; transition: 1.5s ease; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div style="display:flex; align-items:center; gap:12px;">
            <img src="https://i.postimg.cc/s2zWMnCs/Logo-Benh-vien.jpg" width="45" alt="Logo">
            <h2 style="color:var(--primary); margin:0;">QUẢN LÝ SỰ CỐ Y KHOA</h2>
        </div>
        <a href="form.html" class="btn-new">+ BÁO CÁO MỚI</a>
    </header>

    <div class="dashboard-grid">
        <div class="card"><canvas id="deptChart"></canvas></div>
        <div class="card"><canvas id="levelChart"></canvas></div>
        <div class="card"><canvas id="trendChart"></canvas></div>
    </div>

    <div class="filters">
        <div class="f-group"><label>Khoa</label><select id="fDept"><option value="">-- Tất cả --</option></select></div>
        <div class="f-group"><label>Mức độ</label><select id="fLevel"><option value="">-- Tất cả --</option><option value="Nhẹ">Nhẹ</option><option value="TB">TB</option><option value="Nặng">Nặng</option></select></div>
        <div class="f-group" style="flex-grow:1;"><label>Tìm kiếm</label><input type="text" id="sKey" placeholder="Nội dung, tên BN..."></div>
    </div>

    <div class="table-area">
        <table>
            <thead>
                <tr>
                    <th style="width: 100px;">Ngày BC</th>
                    <th style="width: 180px;">Khoa/Phòng</th>
                    <th>Mô tả tóm tắt</th>
                    <th style="width: 90px; text-align:center">Mức độ</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div id="detailModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="margin:0; color:var(--primary);">HỒ SƠ CHI TIẾT SỰ CỐ</h3>
            <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <div class="detail-body">
            <div class="info-panel" id="modalBody"></div>
            <div class="ai-panel">
                <button class="btn-ai" id="btnRunAI" onclick="runAI()">✨ PHÂN TÍCH AI (TRỢ LÝ CHIẾN LƯỢC)</button>
                <div id="aiLoading" style="display:none; text-align:center;">
                    <p style="color: var(--ai-purple);">⚙️ AI đang xử lý dữ liệu...</p>
                </div>
                <div id="aiResult" style="display:none;">
                    <div class="ai-box"><strong>Gốc rễ (RCA):</strong><p id="aiRoot"></p></div>
                    <div class="ai-box"><strong>Kế hoạch (CAPA):</strong><p id="aiPlan"></p></div>
                    <div class="progress-box">
                        <div style="display:flex; justify-content:space-between; font-size:12px;">
                            <strong>Tiến độ:</strong><span id="pText">0%</span>
                        </div>
                        <div class="progress-bar"><div class="progress-fill" id="pFill"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbynaVlHpUE79D4fnczE04D_r83k0F3d_V4YBRVwOsWfhbWv47rdiGomoqQAdtX784U/exec';
    
    // 🔑 DÁN API KEY CỦA BẠN VÀO ĐÂY
    const API_KEY = "AIzaSyBhJuHaTQ1FAabKzqkOhuiQr34C2G40UPQ";

    let db = [], filtered = [], charts = {};

    // --- PHẦN GỠ LỖI AI TRIỆT ĐỂ ---
    async function runAI() {
        const btn = document.getElementById('btnRunAI');
        const loading = document.getElementById('aiLoading');
        const result = document.getElementById('aiResult');
        const idx = document.getElementById('detailModal').dataset.index;

        if (!API_KEY || API_KEY.includes("DÁN_API")) return alert("Vui lòng dán API Key vào code!");

        btn.disabled = true;
        loading.style.display = "block";
        result.style.display = "none";

        const reportData = JSON.stringify(filtered[idx].fullData);

        try {
            // Sử dụng Fetch trực tiếp tới endpoint v1 (Ổn định nhất)
            const apiUrl = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
            
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: `Bạn là chuyên gia an toàn người bệnh. Phân tích sự cố sau: ${reportData}. Trả về duy nhất JSON: {"nguyen_nhan": "...", "ke_hoach": "...", "tien_do": 60}`
                        }]
                    }]
                })
            });

            const json = await response.json();
            
            if (json.error) throw new Error(json.error.message);

            const aiText = json.candidates[0].content.parts[0].text;
            const cleanJson = JSON.parse(aiText.replace(/```json|```/g, "").trim());

            document.getElementById('aiRoot').innerText = cleanJson.nguyen_nhan;
            document.getElementById('aiPlan').innerText = cleanJson.ke_hoach;
            document.getElementById('pFill').style.width = cleanJson.tien_do + "%";
            document.getElementById('pText').innerText = cleanJson.tien_do + "%";

            loading.style.display = "none";
            result.style.display = "block";
        } catch (e) {
            console.error(e);
            alert("Lỗi AI: " + e.message);
            loading.style.display = "none";
        } finally {
            btn.disabled = false;
        }
    }

    // --- PHẦN LOGIC DỮ LIỆU ---
    async function loadData() {
        try {
            const res = await fetch(`${scriptURL}?action=read`);
            const data = await res.json();
            db = data.map(row => {
                const val = Object.values(row);
                const lvRaw = row["Đánh giá ban đầu về mức độ ảnh hưởng"] || val[23] || "Nhẹ";
                let lv = lvRaw.includes("Trung bình") || lvRaw.includes("TB") ? "TB" : (lvRaw.includes("Nặng") ? "Nặng" : "Nhẹ");
                return {
                    date: row["Ngày báo cáo"] || val[3] || "---",
                    dept: row["Khoa/phòng/vị trí xảy ra"] || val[11] || "KĐ",
                    desc: row["Mô tả ngắn gọn"] || val[15] || "---",
                    level: lv,
                    fullData: row
                };
            });
            filtered = [...db];
            renderTable();
            initFilters();
            initCharts();
        } catch (e) { console.error(e); }
    }

    function renderTable() {
        const body = document.getElementById('tableBody');
        body.innerHTML = filtered.map((i, idx) => `
            <tr onclick="showDetail(${idx})">
                <td>${i.date}</td>
                <td><b>${i.dept}</b></td>
                <td>${i.desc}</td>
                <td style="text-align:center"><span class="pill status-${i.level}">${i.level}</span></td>
            </tr>
        `).join('');
    }

    function showDetail(idx) {
        const modal = document.getElementById('detailModal');
        const item = filtered[idx].fullData;
        modal.dataset.index = idx;
        
        document.getElementById('modalBody').innerHTML = Object.keys(item).map(key => `
            <div class="detail-item"><span class="detail-label">${key}:</span>${item[key] || "---"}</div>
        `).join('');
        
        document.getElementById('aiResult').style.display = "none";
        document.getElementById('aiLoading').style.display = "none";
        modal.style.display = "block";
    }

    function closeModal() { document.getElementById('detailModal').style.display = "none"; }

    function initFilters() {
        const depts = [...new Set(db.map(i => i.dept))].sort();
        const sel = document.getElementById('fDept');
        depts.forEach(d => sel.add(new Option(d, d)));
        
        document.querySelectorAll('.filters input, .filters select').forEach(el => {
            el.oninput = () => {
                const d = document.getElementById('fDept').value;
                const l = document.getElementById('fLevel').value;
                const k = document.getElementById('sKey').value.toLowerCase();
                filtered = db.filter(i => (d==="" || i.dept===d) && (l==="" || i.level===l) && i.desc.toLowerCase().includes(k));
                renderTable();
            };
        });
    }

    function initCharts() {
        Chart.register(ChartDataLabels);
        const ctx1 = document.getElementById('deptChart').getContext('2d');
        const ctx2 = document.getElementById('levelChart').getContext('2d');
        // (Rút gọn phần chart để tập trung vào gỡ lỗi AI)
    }

    document.addEventListener('DOMContentLoaded', loadData);
    window.onclick = (e) => { if(e.target.id === 'detailModal') closeModal(); };
</script>
</body>
</html>
