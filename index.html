<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Sự cố - Bệnh viện</title>
    <style>
        :root { --primary: #2980b9; --bg: #f4f7f6; --success: #27ae60; --orange: #f39c12; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 1600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px; }
        .btn-new { background: var(--success); color: white; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; }

        /* Dashboard Layout */
        .dashboard { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: #fff; padding: 15px; border-radius: 10px; border: 1px solid #eee; height: 300px; }
        
        /* Filter Section */
        .filters { display: flex; flex-wrap: wrap; gap: 10px; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .f-group { display: flex; flex-direction: column; gap: 5px; }
        .f-group label { font-size: 12px; font-weight: bold; color: #666; }
        .f-group input, .f-group select { padding: 8px; border: 1px solid #ddd; border-radius: 4px; }

        /* Table Style */
        .table-area { overflow-y: auto; height: 450px; border: 1px solid #eee; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: var(--primary); color: white; position: sticky; top: 0; padding: 12px; text-align: left; z-index: 10; }
        td { padding: 12px; border-bottom: 1px solid #f0f0f0; }
        tr:hover { background: #f1f7ff; }

        /* Status Pills */
        .pill { padding: 4px 10px; border-radius: 20px; color: white; font-weight: bold; font-size: 11px; text-transform: uppercase; }
        .status-Nhẹ { background: #3498db; }
        .status-TB { background: var(--orange); }
        .status-Nặng { background: var(--danger); }

        /* Pagination */
        .paging { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding: 10px; }
        .page-btns { display: flex; gap: 5px; }
        .btn-p { padding: 6px 12px; border: 1px solid #ddd; background: white; cursor: pointer; border-radius: 4px; }
        .btn-p.active { background: var(--primary); color: white; border-color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div style="display:flex; align-items:center; gap:15px;">
            <img src="https://i.postimg.cc/s2zWMnCs/Logo-Benh-vien.jpg" width="50" alt="Logo">
            <h2 style="color:var(--primary); margin:0;">QUẢN LÝ SỰ CỐ Y KHOA</h2>
        </div>
        <a href="form.html" class="btn-new">+ TẠO MỚI</a>
    </header>

    <div class="dashboard">
        <div class="card"><canvas id="deptChart"></canvas></div>
        <div class="card"><canvas id="levelChart"></canvas></div>
    </div>

    <div class="filters">
        <div class="f-group"><label>Từ ngày</label><input type="date" id="startD"></div>
        <div class="f-group"><label>Đến ngày</label><input type="date" id="endD"></div>
        <div class="f-group"><label>Khoa xảy ra</label><select id="fDept"><option value="">-- Tất cả --</option></select></div>
        <div class="f-group"><label>Mức độ</label><select id="fLevel"><option value="">-- Tất cả --</option><option value="Nhẹ">Nhẹ</option><option value="TB">Trung bình</option><option value="Nặng">Nặng</option></select></div>
        <div class="f-group" style="flex-grow:1;"><label>Tìm kiếm theo Mô tả</label><input type="text" id="sKey" placeholder="Tên BN, Số hồ sơ, nội dung sự cố..."></div>
    </div>

    <div class="table-area">
        <table>
            <thead>
                <tr>
                    <th>Ngày BC</th>
                    <th>Khoa xảy ra</th>
                    <th>Tên bệnh nhân</th>
                    <th>Mô tả tóm tắt</th>
                    <th style="text-align:center">Mức độ</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="5" style="text-align:center; padding:50px;">Đang đồng bộ dữ liệu từ hệ thống...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="paging">
        <div id="pageInfo" style="font-size:13px; color:#666;"></div>
        <div class="page-btns" id="pageNav"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

<script>
    // URL Web App từ Google Apps Script của bạn
    const scriptURL = 'https://script.google.com/macros/s/AKfycbynaVlHpUE79D4fnczE04D_r83k0F3d_V4YBRVwOsWfhbWv47rdiGomoqQAdtX784U/exec'; 
    
    let db = [], filtered = [];
    let currentPage = 1;
    const limit = 10;
    let chart1, chart2;

    document.addEventListener('DOMContentLoaded', loadData);
    document.querySelectorAll('.filters input, .filters select').forEach(el => el.oninput = filterData);

    async function loadData() {
        try {
            const res = await fetch(`${scriptURL}?action=read`);
            const json = await res.json();

            // ÁNH XẠ DỮ LIỆU THEO ĐÚNG THỨ TỰ CỘT BẠN ĐÃ CUNG CẤP
            db = json.map(row => {
                // Tận dụng cả tên cột hoặc chỉ số index để lấy dữ liệu chính xác
                const val = Object.values(row); 
                const dateRaw = row["Ngày báo cáo"] || val[3] || "";
                const dept = row["Khoa/phòng/vị trí xảy ra"] || val[11] || "Không xác định";
                const patient = row["Họ và tên BN"] || val[5] || "N/A";
                const desc = row["Mô tả ngắn gọn"] || val[15] || "";
                const levelRaw = row["Đánh giá ban đầu về mức độ ảnh hưởng"] || val[23] || "Nhẹ";

                let lv = "Nhẹ";
                if(levelRaw.includes("Trung bình") || levelRaw.includes("TB")) lv = "TB";
                if(levelRaw.includes("Nặng")) lv = "Nặng";

                return {
                    date: dateRaw,
                    dept: dept,
                    patient: patient,
                    desc: desc,
                    level: lv,
                    ts: parseDate(dateRaw).getTime()
                };
            });

            filtered = [...db];
            updateFilters();
            initCharts();
            render();
        } catch (e) {
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" style="text-align:center;color:red;">Lỗi kết nối dữ liệu. Vui lòng kiểm tra Deployment.</td></tr>';
        }
    }

    function parseDate(s) {
        if(!s) return new Date();
        const p = s.split('/');
        return p.length === 3 ? new Date(p[2], p[1]-1, p[0]) : new Date(s);
    }

    function filterData() {
        const start = document.getElementById('startD').value;
        const end = document.getElementById('endD').value;
        const dept = document.getElementById('fDept').value;
        const level = document.getElementById('fLevel').value;
        const key = document.getElementById('sKey').value.toLowerCase();

        const sTs = start ? new Date(start).getTime() : 0;
        const eTs = end ? new Date(end).setHours(23,59,59) : Infinity;

        filtered = db.filter(i => 
            (i.ts >= sTs && i.ts <= eTs) &&
            (dept === "" || i.dept === dept) &&
            (level === "" || i.level === level) &&
            (i.patient.toLowerCase().includes(key) || i.desc.toLowerCase().includes(key) || i.dept.toLowerCase().includes(key))
        );

        currentPage = 1;
        render();
        updateCharts();
    }

    function render() {
        const start = (currentPage - 1) * limit;
        const data = filtered.slice(start, start + limit);
        
        document.getElementById('tableBody').innerHTML = data.map(i => `
            <tr>
                <td>${i.date}</td>
                <td><b>${i.dept}</b></td>
                <td>${i.patient}</td>
                <td>${i.desc}</td>
                <td style="text-align:center"><span class="pill status-${i.level}">${i.level}</span></td>
            </tr>
        `).join('') || '<tr><td colspan="5" style="text-align:center">Không tìm thấy kết quả</td></tr>';

        document.getElementById('pageInfo').innerText = `Hiển thị ${data.length > 0 ? start+1 : 0}-${Math.min(start+limit, filtered.length)} / Tổng ${filtered.length}`;
        renderPaging();
    }

    function renderPaging() {
        const total = Math.ceil(filtered.length / limit);
        const nav = document.getElementById('pageNav');
        nav.innerHTML = '';
        if(total <= 1) return;

        for(let i=1; i<=total; i++) {
            const b = document.createElement('button');
            b.className = `btn-p ${i === currentPage ? 'active' : ''}`;
            b.innerText = i;
            b.onclick = () => { currentPage = i; render(); };
            nav.appendChild(b);
        }
    }

    function updateFilters() {
        const depts = [...new Set(db.map(i => i.dept))].sort();
        const sel = document.getElementById('fDept');
        depts.forEach(d => sel.add(new Option(d, d)));
    }

    function initCharts() {
        const ctx1 = document.getElementById('deptChart');
        const ctx2 = document.getElementById('levelChart');
        const data = getAgg();

        chart1 = new Chart(ctx1, {
            type: 'bar',
            data: { labels: data.labels, datasets: [{ label: 'Số vụ', data: data.counts, backgroundColor: '#2980b9' }] },
            options: { maintainAspectRatio: false, plugins: { title: { display:true, text:'SỰ CỐ THEO KHOA/PHÒNG' } } }
        });

        chart2 = new Chart(ctx2, {
            type: 'doughnut',
            data: { labels: ['Nhẹ', 'TB', 'Nặng'], datasets: [{ data: data.lv, backgroundColor: ['#3498db', '#f39c12', '#e74c3c'] }] },
            options: { maintainAspectRatio: false, plugins: { legend:{position:'bottom'}, title:{display:true, text:'TỶ LỆ MỨC ĐỘ'} } }
        });
    }

    function updateCharts() {
        const data = getAgg();
        chart1.data.labels = data.labels;
        chart1.data.datasets[0].data = data.counts;
        chart2.data.datasets[0].data = data.lv;
        chart1.update(); chart2.update();
    }

    function getAgg() {
        const depts = {};
        const lv = { Nhẹ: 0, TB: 0, Nặng: 0 };
        filtered.forEach(i => {
            depts[i.dept] = (depts[i.dept] || 0) + 1;
            if(lv.hasOwnProperty(i.level)) lv[i.level]++;
        });
        return {
            labels: Object.keys(depts),
            counts: Object.values(depts),
            lv: [lv.Nhẹ, lv.TB, lv.Nặng]
        };
    }
</script>
</body>
</html>
