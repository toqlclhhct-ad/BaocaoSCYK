<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Sự cố y khoa - Bệnh viện</title>
    <style>
        :root { --primary: #2980b9; --bg: #f4f7f6; --success: #27ae60; --orange: #f39c12; --danger: #e74c3c; --ai-purple: #8e44ad; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 1600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 15px; }
        
        /* Dashboard Charts */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 0.8fr 1.2fr; gap: 15px; margin-bottom: 20px; }
        .card { background: #fff; padding: 15px; border-radius: 10px; border: 1px solid #eee; height: 250px; position: relative; }
        
        /* Filters */
        .filters { display: flex; flex-wrap: wrap; gap: 12px; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #eee; }
        .f-group { display: flex; flex-direction: column; gap: 5px; }
        .f-group label { font-size: 12px; font-weight: bold; color: #666; }
        .f-group input, .f-group select { padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
        
        /* Table */
        .table-area { overflow-x: auto; border: 1px solid #eee; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 800px; }
        th { background: var(--primary); color: white; padding: 12px; text-align: left; position: sticky; top: 0; }
        td { padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        tr:hover { background: #f1f7ff; }
        
        .pill { padding: 4px 10px; border-radius: 20px; color: white; font-weight: bold; font-size: 11px; }
        .status-Nhẹ { background: #3498db; } .status-TB { background: var(--orange); } .status-Nặng { background: var(--danger); }
        
        /* Modal */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .modal-content { background: white; margin: 1% auto; width: 95%; max-width: 1200px; border-radius: 12px; max-height: 95vh; overflow-y: auto; }
        .modal-header { position: sticky; top: 0; background: white; z-index: 10; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding: 15px 20px; }
        .detail-body { padding: 20px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
        
        /* AI Panel */
        .ai-panel { background: #fcfaff; border-radius: 8px; padding: 15px; border: 1px solid #e0d0f0; }
        .btn-ai { background: var(--ai-purple); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .ai-box { background: white; border-left: 4px solid var(--ai-purple); padding: 15px; margin-top: 15px; font-size: 13px; white-space: pre-line; line-height: 1.6; }
        
        .progress-bar { height: 10px; background: #eee; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--success); width: 0%; transition: 1.5s; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2 style="color:var(--primary); margin:0;">🏥 HỆ THỐNG QUẢN LÝ SỰ CỐ Y KHOA</h2>
        <div id="loadingText" style="color: var(--orange); font-weight: bold;">Đang tải dữ liệu...</div>
    </header>

    <div class="dashboard-grid">
        <div class="card"><canvas id="deptChart"></canvas></div>
        <div class="card"><canvas id="levelChart"></canvas></div>
        <div class="card"><canvas id="trendChart"></canvas></div>
    </div>

    <div class="filters">
        <div class="f-group"><label>Từ ngày</label><input type="date" id="startD"></div>
        <div class="f-group"><label>Đến ngày</label><input type="date" id="endD"></div>
        <div class="f-group"><label>Khoa xảy ra</label><select id="fDept"><option value="">-- Tất cả --</option></select></div>
        <div class="f-group"><label>Mức độ</label><select id="fLevel"><option value="">-- Tất cả --</option><option value="Nhẹ">Nhẹ</option><option value="TB">TB</option><option value="Nặng">Nặng</option></select></div>
        <div class="f-group" style="flex-grow:1;"><label>Tìm kiếm nhanh</label><input type="text" id="sKey" placeholder="Nội dung sự cố..."></div>
    </div>

    <div class="table-area">
        <table>
            <thead>
                <tr>
                    <th style="width: 100px;">Ngày BC</th>
                    <th style="width: 200px;">Khoa xảy ra</th>
                    <th>Mô tả sự cố</th>
                    <th style="width: 100px; text-align:center">Mức độ</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div id="detailModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="margin:0; color:var(--primary);">CHI TIẾT THÔNG TIN SỰ CỐ</h3>
            <span style="cursor:pointer; font-size:30px;" onclick="closeModal()">&times;</span>
        </div>
        <div class="detail-body">
            <div id="modalDataArea" style="border-right: 1px solid #eee; padding-right: 20px;"></div>
            <div class="ai-panel">
                <button class="btn-ai" id="btnRunAI" onclick="runAI()">✨ CHẠY PHÂN TÍCH AI (GEMINI 1.5)</button>
                <div id="aiContent" class="ai-box" style="display:none;"></div>
                <div id="aiProgress" style="display:none; margin-top:15px;">
                    <div class="progress-bar"><div class="progress-fill" id="pFill"></div></div>
                    <div style="display:flex; justify-content:space-between; font-size:11px;">
                        <span>AI đang xử lý...</span>
                        <span id="pText">0%</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const scriptURL = 'DÁN_LINK_WEB_APP_MỚI_VÀO_ĐÂY'; 
    let db = [], filtered = [], charts = {};

    window.onload = loadData;
    document.querySelectorAll('.filters input, .filters select').forEach(el => el.oninput = filterData);

    async function loadData() {
        try {
            const res = await fetch(`${scriptURL}?action=read`);
            const data = await res.json();
            db = data.map(row => {
                const keys = Object.keys(row);
                const dateStr = row["Ngày báo cáo"] || "";
                const levelRaw = (row["Đánh giá ban đầu về mức độ ảnh hưởng"] || "Nhẹ").toLowerCase();
                let lv = levelRaw.includes("nặng") ? "Nặng" : (levelRaw.includes("trung bình") ? "TB" : "Nhẹ");
                return {
                    date: dateStr,
                    dept: row["Khoa/phòng/vị trí xảy ra"] || "N/A",
                    desc: row["Mô tả ngắn gọn"] || "---",
                    level: lv,
                    full: row
                };
            });
            filtered = [...db];
            updateFilterOptions();
            initCharts();
            renderTable();
            document.getElementById('loadingText').style.display = 'none';
        } catch (e) { alert("Lỗi tải dữ liệu. Hãy kiểm tra link Web App!"); }
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = filtered.map((i, idx) => `
            <tr onclick="showDetail(${idx})">
                <td>${i.date}</td>
                <td><b>${i.dept}</b></td>
                <td>${i.desc}</td>
                <td style="text-align:center"><span class="pill status-${i.level}">${i.level}</span></td>
            </tr>
        `).join('') || '<tr><td colspan="4" style="text-align:center">Không có dữ liệu</td></tr>';
    }

    function showDetail(idx) {
        const item = filtered[idx].full;
        document.getElementById('modalDataArea').innerHTML = Object.entries(item).map(([k,v]) => `
            <p style="font-size:12px; border-bottom:1px solid #f0f0f0; padding:5px 0;">
                <b style="color:var(--primary)">${k}:</b> ${v || "---"}
            </p>
        `).join('');
        document.getElementById('aiContent').style.display = 'none';
        document.getElementById('detailModal').dataset.currentIdx = idx;
        document.getElementById('detailModal').style.display = 'block';
    }

    async function runAI() {
        const idx = document.getElementById('detailModal').dataset.currentIdx;
        const btn = document.getElementById('btnRunAI');
        const aiBox = document.getElementById('aiContent');
        const prog = document.getElementById('aiProgress');
        
        btn.disabled = true;
        prog.style.display = 'block';
        aiBox.style.display = 'none';

        try {
            const res = await fetch(`${scriptURL}?action=ai&data=${encodeURIComponent(JSON.stringify(filtered[idx].full))}`);
            const result = await res.json();
            if(result.error) throw new Error(result.error);
            
            aiBox.innerText = result.text;
            aiBox.style.display = 'block';
            document.getElementById('pFill').style.width = "100%";
            document.getElementById('pText').innerText = "100% - Hoàn tất";
        } catch (e) {
            alert("AI Error: " + e.message);
            btn.disabled = false;
        }
    }

    function filterData() {
        const start = document.getElementById('startD').value;
        const end = document.getElementById('endD').value;
        const dept = document.getElementById('fDept').value;
        const level = document.getElementById('fLevel').value;
        const key = document.getElementById('sKey').value.toLowerCase();

        filtered = db.filter(i => {
            const matchDept = dept === "" || i.dept === dept;
            const matchLevel = level === "" || i.level === level;
            const matchKey = i.desc.toLowerCase().includes(key) || i.dept.toLowerCase().includes(key);
            return matchDept && matchLevel && matchKey;
        });
        renderTable();
        updateCharts();
    }

    function updateFilterOptions() {
        const depts = [...new Set(db.map(i => i.dept))].sort();
        const sel = document.getElementById('fDept');
        depts.forEach(d => sel.add(new Option(d, d)));
    }

    function closeModal() { document.getElementById('detailModal').style.display = 'none'; }

    // --- CHART LOGIC ---
    function initCharts() {
        const ctx1 = document.getElementById('deptChart');
        charts.dept = new Chart(ctx1, { type: 'bar', data: { labels: [], datasets: [{ data: [], backgroundColor: '#2980b9' }] }, options: { maintainAspectRatio: false, plugins: { title: { display:true, text:'SỐ LƯỢNG THEO KHOA' }, legend: {display:false} } } });
        
        const ctx2 = document.getElementById('levelChart');
        charts.level = new Chart(ctx2, { type: 'pie', data: { labels: ['Nhẹ','TB','Nặng'], datasets: [{ data: [0,0,0], backgroundColor: ['#3498db','#f39c12','#e74c3c'] }] }, options: { maintainAspectRatio: false } });
        
        const ctx3 = document.getElementById('trendChart');
        charts.trend = new Chart(ctx3, { type: 'line', data: { labels: ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'], datasets: [{ label: 'Sự cố 2026', data: [], borderColor: '#2980b9' }] }, options: { maintainAspectRatio: false } });
        updateCharts();
    }

    function updateCharts() {
        const deptCounts = {};
        const lvCounts = { Nhẹ: 0, TB: 0, Nặng: 0 };
        filtered.forEach(i => {
            deptCounts[i.dept] = (deptCounts[i.dept] || 0) + 1;
            lvCounts[i.level]++;
        });

        charts.dept.data.labels = Object.keys(deptCounts);
        charts.dept.data.datasets[0].data = Object.values(deptCounts);
        charts.level.data.datasets[0].data = [lvCounts.Nhẹ, lvCounts.TB, lvCounts.Nặng];
        charts.dept.update(); charts.level.update();
    }
</script>
</body>
</html>
