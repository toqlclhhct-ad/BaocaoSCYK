<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Sự cố - 3 Year Trend</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <style>
        :root { --title-color: #2980b9; --bg-body: #f4f7f6; --success-color: #27ae60; --orange-color: #f39c12; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-body); padding: 15px; margin: 0; }
        .container { max-width: 1200px; margin: 10px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--title-color); margin-bottom: 20px; padding-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-left h2 { color: var(--title-color); text-transform: uppercase; margin: 0; font-size: 16px; }

        .btn-new { background: var(--success-color); color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; font-size: 13px; transition: 0.3s; }

        /* Bố cục Dashboard mới */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .chart-card { background: #fff; padding: 10px; border-radius: 10px; border: 1px solid #eee; height: 280px; }
        .full-width { grid-column: span 2; height: 320px; }
        
        .filter-section { display: flex; flex-wrap: wrap; gap: 10px; background: #f9f9f9; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #eee; }
        .filter-group { display: flex; flex-direction: column; gap: 4px; }
        .filter-group label { font-size: 11px; font-weight: bold; color: #555; }
        .filter-group input, .filter-group select { padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
        
        .table-container { overflow-x: auto; max-height: 400px; border: 1px solid #eee; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background-color: var(--title-color); color: white; padding: 10px; text-align: left; position: sticky; top: 0; z-index: 5; }
        td { padding: 10px; border-bottom: 1px solid #eee; }

        .status-pill { padding: 3px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; color: white; display: inline-block; min-width: 55px; text-align: center; }
        .status-heavy { background: #e74c3c; }
        .status-TB { background: var(--orange-color); }
        .status-light { background: #3498db; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-left">
            <img src="https://i.postimg.cc/s2zWMnCs/Logo-Benh-vien.jpg" alt="Logo" style="width: 40px; height: auto;">
            <h2>Hệ thống quản lý sự cố y khoa</h2>
        </div>
        <a href="form.html" class="btn-new">+ TẠO MỚI</a>
    </header>

    <div class="dashboard-grid">
        <div class="chart-card"><canvas id="deptChart"></canvas></div>
        <div class="chart-card"><canvas id="levelChart"></canvas></div>
        <div class="chart-card full-width"><canvas id="trendChart"></canvas></div>
    </div>

    <div class="filter-section">
        <div class="filter-group"><label>Từ ngày:</label><input type="date" id="startDate"></div>
        <div class="filter-group"><label>Đến ngày:</label><input type="date" id="endDate"></div>
        <div class="filter-group"><label>Khoa:</label><select id="filterDept"><option value="">-- Tất cả --</option></select></div>
        <div class="filter-group"><label>Mức độ:</label><select id="filterLevel"><option value="">-- Tất cả --</option><option value="Nhẹ">Nhẹ</option><option value="TB">TB</option><option value="Nặng">Nặng</option></select></div>
        <div class="filter-group" style="flex-grow: 1;"><label>Tìm kiếm theo mô tả:</label><input type="text" id="searchDesc" placeholder="Từ khóa..."></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 100px;">Ngày BC</th>
                    <th style="width: 180px;">Khoa/Phòng</th>
                    <th>Mô tả</th>
                    <th style="width: 80px;">Mức độ</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwsgg3TyHuF60XbkdaHr6uTrXW8akj5Np9f9MjKoC0nNhZoFHnekWpkqpQzAYPpdjQ/exec';
    let originalData = [];
    let deptChart, levelChart, trendChart;
    const currentYear = new Date().getFullYear();

    document.addEventListener('DOMContentLoaded', async () => {
        setupEventListeners();
        await loadData();
    });

    async function loadData() {
        try {
            const response = await fetch(`${scriptURL}?action=read`);
            const rawData = await response.json();
            
            originalData = rawData.map(item => {
                const dateObj = parseDate(item.date);
                return {
                    ...item,
                    level: (item.level === "Trung bình" || item.level === "TB") ? "TB" : item.level,
                    levelClass: (item.level === "Trung bình" || item.level === "TB") ? "TB" : item.levelClass,
                    timestamp: dateObj.getTime(),
                    year: dateObj.getFullYear(),
                    month: dateObj.getMonth()
                };
            });

            populateDeptFilter(originalData);
            renderTable(originalData);
            initCharts(originalData);
        } catch (error) {
            console.error(error);
        }
    }

    function setupEventListeners() {
        const filters = ['startDate', 'endDate', 'filterDept', 'filterLevel', 'searchDesc'];
        filters.forEach(id => {
            document.getElementById(id).addEventListener(id === 'searchDesc' ? 'keyup' : 'change', debounce(filterData, 250));
        });
    }

    function debounce(func, timeout) {
        let timer;
        return (...args) => {
            clearTimeout(timer);
            timer = setTimeout(() => { func.apply(this, args); }, timeout);
        };
    }

    function parseDate(dateStr) {
        const parts = dateStr.split('/');
        return new Date(parts[2], parts[1] - 1, parts[0]);
    }

    function getAggregatedData(data) {
        const lv = { 'Nhẹ': 0, 'TB': 0, 'Nặng': 0 };
        const dp = {};
        const trend = {
            [currentYear]: Array(12).fill(0),
            [currentYear - 1]: Array(12).fill(0),
            [currentYear - 2]: Array(12).fill(0)
        };

        for (const item of data) {
            if (lv.hasOwnProperty(item.level)) lv[item.level]++;
            dp[item.dept] = (dp[item.dept] || 0) + 1;
            if (trend[item.year]) trend[item.year][item.month]++;
        }
        return { lv, dp, trend };
    }

    function initCharts(data) {
        const res = getAggregatedData(data);
        Chart.register(ChartDataLabels);

        // Bar Chart
        deptChart = new Chart(document.getElementById('deptChart'), {
            type: 'bar',
            data: { labels: Object.keys(res.dp), datasets: [{ data: Object.values(res.dp), backgroundColor: '#2980b9' }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, datalabels: { anchor: 'end', align: 'top', font: { weight: 'bold' } } } }
        });

        // Doughnut Chart
        levelChart = new Chart(document.getElementById('levelChart'), {
            type: 'doughnut',
            data: { 
                labels: ['Nhẹ', 'TB', 'Nặng'], 
                datasets: [{ data: [res.lv['Nhẹ'], res.lv['TB'], res.lv['Nặng']], backgroundColor: ['#3498db', '#f39c12', '#e74c3c'] }] 
            },
            options: {
                responsive: true, maintainAspectRatio: false, cutout: '65%',
                plugins: {
                    legend: { position: 'right', labels: { boxWidth: 10 } },
                    datalabels: {
                        color: '#fff', font: { weight: 'bold', size: 10 },
                        formatter: (v, ctx) => {
                            const sum = ctx.dataset.data.reduce((a, b) => a + b, 0);
                            return v > 0 ? `${v}\n(${(v*100/sum).toFixed(0)}%)` : '';
                        }
                    }
                }
            }
        });

        // Trend Chart (BIỂU ĐỒ ĐƯỜNG 3 NĂM)
        trendChart = new Chart(document.getElementById('trendChart'), {
            type: 'line',
            data: {
                labels: ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'],
                datasets: [
                    { label: currentYear - 2, data: res.trend[currentYear - 2], borderColor: '#bdc3c7', tension: 0.3, pointRadius: 2 },
                    { label: currentYear - 1, data: res.trend[currentYear - 1], borderColor: '#3498db', tension: 0.3, pointRadius: 2 },
                    { label: currentYear, data: res.trend[currentYear], borderColor: '#e67e22', borderWidth: 3, tension: 0.3, pointRadius: 4 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    title: { display: true, text: 'XU HƯỚNG SỰ CỐ THEO THÁNG (3 NĂM GẦN NHẤT)', font: { size: 13 } },
                    datalabels: { display: false }
                },
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
            }
        });
    }

    function filterData() {
        const s = document.getElementById('searchDesc').value.toLowerCase();
        const d = document.getElementById('filterDept').value;
        const l = document.getElementById('filterLevel').value;
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        
        const startTime = start ? new Date(start).getTime() : 0;
        const endTime = end ? new Date(end).setHours(23,59,59,999) : Infinity;

        const filtered = originalData.filter(item => {
            return (item.timestamp >= startTime && item.timestamp <= endTime) &&
                   (d === "" || item.dept === d) &&
                   (l === "" || item.level === l) &&
                   (item.desc.toLowerCase().includes(s) || item.dept.toLowerCase().includes(s));
        });

        renderTable(filtered);
        const res = getAggregatedData(filtered);
        
        deptChart.data.labels = Object.keys(res.dp);
        deptChart.data.datasets[0].data = Object.values(res.dp);
        deptChart.update('none');

        levelChart.data.datasets[0].data = [res.lv['Nhẹ'], res.lv['TB'], res.lv['Nặng']];
        levelChart.update('none');

        trendChart.data.datasets[0].data = res.trend[currentYear - 2];
        trendChart.data.datasets[1].data = res.trend[currentYear - 1];
        trendChart.data.datasets[2].data = res.trend[currentYear];
        trendChart.update('none');
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = data.map(row => `
            <tr>
                <td>${row.date}</td>
                <td>${row.dept}</td>
                <td>${row.desc}</td>
                <td><span class="status-pill status-${row.levelClass}">${row.level}</span></td>
            </tr>`).join('') || '<tr><td colspan="4" style="text-align:center;">Không tìm thấy dữ liệu.</td></tr>';
    }

    function populateDeptFilter(data) {
        const deptSelect = document.getElementById('filterDept');
        const depts = [...new Set(data.map(i => i.dept))].filter(Boolean).sort();
        deptSelect.innerHTML = '<option value="">-- Tất cả --</option>' + depts.map(d => `<option value="${d}">${d}</option>`).join('');
    }
</script>
</body>
</html>
