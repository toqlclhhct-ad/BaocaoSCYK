<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Sự cố - Dashboard</title>
    <style>
        :root { --title-color: #2980b9; --bg-body: #f4f7f6; --success-color: #27ae60; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-body); padding: 15px; margin: 0; }
        .container { max-width: 1200px; margin: 10px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--title-color); margin-bottom: 20px; padding-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-left h2 { color: var(--title-color); text-transform: uppercase; margin: 0; font-size: 16px; }

        .btn-new { background: var(--success-color); color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; font-size: 13px; transition: 0.3s; }

        /* Chia tỷ lệ 2/3 và 1/3 */
        .dashboard-grid { 
            display: grid; 
            grid-template-columns: 2fr 1fr; 
            gap: 15px; 
            margin-bottom: 20px; 
        }
        
        /* Chiều cao tổng thể giảm xuống còn khoảng 250px */
        .chart-card { 
            background: #fff; 
            padding: 10px; 
            border-radius: 10px; 
            border: 1px solid #eee; 
            height: 250px; 
            position: relative;
        }
        
        .filter-section { display: flex; flex-wrap: wrap; gap: 10px; background: #f9f9f9; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #eee; }
        .filter-group { display: flex; flex-direction: column; gap: 4px; }
        .filter-group label { font-size: 11px; font-weight: bold; color: #555; }
        .filter-group input, .filter-group select { padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
        
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background-color: var(--title-color); color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }

        .status-pill { padding: 3px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; color: white; }
        .status-heavy { background: #e74c3c; }
        .status-medium { background: #f39c12; }
        .status-light { background: #3498db; }

        /* Responsive cho Mobile */
        @media (max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .chart-card { height: 220px; }
            /* Tăng chiều cao riêng cho biểu đồ cột trên mobile để nhìn rõ các khoa */
            #deptChartContainer { height: 350px; } 
            header { flex-direction: column; gap: 10px; align-items: flex-start; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-left">
            <img src="https://i.postimg.cc/s2zWMnCs/Logo-Benh-vien.jpg" alt="Logo" style="width: 40px; height: auto;">
            <h2>Hệ thống quản lý sự cố</h2>
        </div>
        <a href="form.html" class="btn-new">+ TẠO MỚI</a>
    </header>

    <div class="dashboard-grid">
        <div class="chart-card" id="deptChartContainer">
            <canvas id="deptChart"></canvas>
        </div>
        <div class="chart-card">
            <canvas id="levelChart"></canvas>
        </div>
    </div>

    <div class="filter-section">
        <div class="filter-group"><label>Ngày:</label><input type="date" id="filterDate" onchange="filterData()"></div>
        <div class="filter-group"><label>Khoa/Phòng:</label><select id="filterDept" onchange="filterData()"><option value="">-- Tất cả --</option></select></div>
        <div class="filter-group"><label>Mức độ:</label><select id="filterLevel" onchange="filterData()"><option value="">-- Tất cả --</option><option value="Nhẹ">Nhẹ</option><option value="Trung bình">Trung bình</option><option value="Nặng">Nặng</option></select></div>
        <div class="filter-group" style="flex-grow: 1;"><label>Tìm kiếm:</label><input type="text" id="searchDesc" placeholder="Từ khóa..." onkeyup="filterData()"></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Ngày BC</th>
                    <th>Khoa/Phòng</th>
                    <th>Mô tả</th>
                    <th>Mức độ</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwsgg3TyHuF60XbkdaHr6uTrXW8akj5Np9f9MjKoC0nNhZoFHnekWpkqpQzAYPpdjQ/exec';
    let originalData = [];

    window.onload = function() {
        fetch(scriptURL + '?action=read')
        .then(res => res.json())
        .then(data => {
            originalData = data;
            populateDeptFilter(data);
            renderTable(data);
            renderCharts(data);
        });
    }

    function populateDeptFilter(data) {
        const deptSelect = document.getElementById('filterDept');
        [...new Set(data.map(item => item.dept))].sort().forEach(dept => {
            const opt = document.createElement('option');
            opt.value = dept; opt.textContent = dept;
            deptSelect.appendChild(opt);
        });
    }

    function filterData() {
        const s = document.getElementById('searchDesc').value.toLowerCase();
        const d = document.getElementById('filterDept').value;
        const l = document.getElementById('filterLevel').value;
        const t = document.getElementById('filterDate').value;
        const filtered = originalData.filter(item => {
            const matchDate = t === "" || item.date.split('/').reverse().join('-') === t;
            return item.desc.toLowerCase().includes(s) && (d === "" || item.dept === d) && (l === "" || item.level === l) && matchDate;
        });
        renderTable(filtered);
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = data.map(row => `
            <tr>
                <td>${row.date}</td>
                <td>${row.dept}</td>
                <td title="${row.desc}">${row.desc}</td>
                <td><span class="status-pill status-${row.levelClass}">${row.level}</span></td>
            </tr>`).join('') || '<tr><td colspan="4" style="text-align:center;">Không có dữ liệu.</td></tr>';
    }

    function renderCharts(data) {
        const lv = { 'Nhẹ': 0, 'Trung bình': 0, 'Nặng': 0 };
        const dp = {};
        data.forEach(i => { if (lv.hasOwnProperty(i.level)) lv[i.level]++; dp[i.dept] = (dp[i.dept] || 0) + 1; });

        Chart.register(ChartDataLabels);

        // Bar Chart (2/3 width)
        new Chart(document.getElementById('deptChart'), {
            type: 'bar',
            data: { labels: Object.keys(dp), datasets: [{ data: Object.values(dp), backgroundColor: '#2980b9' }] },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: { display: true, text: 'Số lượng theo Khoa/Phòng', font: {size: 13} },
                    legend: { display: false },
                    datalabels: { anchor: 'end', align: 'top', color: '#2980b9', font: { weight: 'bold' } }
                },
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
            }
        });

        // Pie Chart (1/3 width)
        new Chart(document.getElementById('levelChart'), {
            type: 'pie',
            data: { labels: Object.keys(lv), datasets: [{ data: Object.values(lv), backgroundColor: ['#3498db', '#f39c12', '#e74c3c'] }] },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: { display: true, text: 'Tỷ lệ Mức độ', font: {size: 13} },
                    legend: { position: 'bottom', labels: { boxWidth: 10, font: {size: 10} } },
                    datalabels: {
                        color: '#fff',
                        formatter: (v, c) => {
                            let s = c.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
                            return v > 0 ? `${(v*100/s).toFixed(0)}%` : '';
                        }
                    }
                }
            }
        });
    }
</script>
</body>
</html>
