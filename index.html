<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Sự cố - Dashboard</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <style>
        :root { --title-color: #2980b9; --bg-body: #f4f7f6; --success-color: #27ae60; --orange-color: #f39c12; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-body); padding: 15px; margin: 0; }
        .container { max-width: 1300px; margin: 10px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--title-color); margin-bottom: 20px; padding-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-left h2 { color: var(--title-color); text-transform: uppercase; margin: 0; font-size: 16px; }
        .btn-new { background: var(--success-color); color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; font-size: 13px; transition: 0.3s; }

        /* Tỷ lệ 2/3 và 1/3 cho Dashboard trên */
        .dashboard-top { display: grid; grid-template-columns: 2fr 1fr; gap: 15px; margin-bottom: 15px; }
        .chart-card { background: #fff; padding: 15px; border-radius: 10px; border: 1px solid #eee; height: 300px; position: relative; }
        .full-width { width: 100%; height: 320px; margin-bottom: 20px; }
        
        .filter-section { display: flex; flex-wrap: wrap; gap: 10px; background: #f9f9f9; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #eee; }
        .filter-group { display: flex; flex-direction: column; gap: 4px; }
        .filter-group label { font-size: 11px; font-weight: bold; color: #555; }
        .filter-group input, .filter-group select { padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
        
        .table-container { overflow-x: auto; max-height: 350px; border: 1px solid #eee; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background-color: var(--title-color); color: white; padding: 10px; text-align: left; position: sticky; top: 0; z-index: 5; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        .status-pill { padding: 3px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; color: white; display: inline-block; min-width: 55px; text-align: center; }
        .status-heavy { background: #e74c3c; } .status-TB { background: var(--orange-color); } .status-light { background: #3498db; }

        @media (max-width: 992px) { .dashboard-top { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-left">
            <img src="https://i.postimg.cc/s2zWMnCs/Logo-Benh-vien.jpg" alt="Logo" style="width: 40px;">
            <h2>Quản lý Sự cố Y khoa</h2>
        </div>
        <a href="form.html" class="btn-new">+ TẠO MỚI</a>
    </header>

    <div class="dashboard-top">
        <div class="chart-card"><canvas id="deptChart"></canvas></div>
        <div class="chart-card"><canvas id="levelChart"></canvas></div>
    </div>
    
    <div class="chart-card full-width"><canvas id="trendChart"></canvas></div>

    <div class="filter-section">
        <div class="filter-group"><label>Từ ngày:</label><input type="date" id="startDate"></div>
        <div class="filter-group"><label>Đến ngày:</label><input type="date" id="endDate"></div>
        <div class="filter-group"><label>Khoa:</label><select id="filterDept"><option value="">-- Tất cả --</option></select></div>
        <div class="filter-group"><label>Mức độ:</label><select id="filterLevel"><option value="">-- Tất cả --</option><option value="Nhẹ">Nhẹ</option><option value="TB">TB</option><option value="Nặng">Nặng</option></select></div>
        <div class="filter-group" style="flex-grow: 1;"><label>Tìm kiếm:</label><input type="text" id="searchDesc" placeholder="Từ khóa..."></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 90px;">Ngày BC</th>
                    <th style="width: 180px;">Khoa/Phòng</th>
                    <th>Mô tả tóm tắt</th>
                    <th style="width: 80px;">Mức độ</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwsgg3TyHuF60XbkdaHr6uTrXW8akj5Np9f9MjKoC0nNhZoFHnekWpkqpQzAYPpdjQ/exec';
    let originalData = [], deptChart, levelChart, trendChart;
    const currentYear = new Date().getFullYear();

    document.addEventListener('DOMContentLoaded', async () => {
        setupListeners();
        await loadData();
    });

    async function loadData() {
        const res = await fetch(`${scriptURL}?action=read`);
        const raw = await res.json();
        originalData = raw.map(i => {
            const d = parseDate(i.date);
            return {...i, 
                level: (i.level === "Trung bình" || i.level === "TB") ? "TB" : i.level,
                levelClass: (i.level === "Trung bình" || i.level === "TB") ? "TB" : i.levelClass,
                ts: d.getTime(), yr: d.getFullYear(), mo: d.getMonth() 
            };
        });
        populateDeptFilter(originalData);
        renderTable(originalData);
        initCharts(originalData);
    }

    function setupListeners() {
        ['startDate', 'endDate', 'filterDept', 'filterLevel', 'searchDesc'].forEach(id => {
            document.getElementById(id).addEventListener('input', debounce(filterData, 200));
        });
    }

    function debounce(f, t) { let timer; return (...a) => { clearTimeout(timer); timer = setTimeout(() => f.apply(this, a), t); }; }
    function parseDate(s) { const p = s.split('/'); return new Date(p[2], p[1]-1, p[0]); }

    function getAgg(data) {
        const lv = { 'Nhẹ': 0, 'TB': 0, 'Nặng': 0 }, dp = {}, tr = {[currentYear]: Array(12).fill(0), [currentYear-1]: Array(12).fill(0), [currentYear-2]: Array(12).fill(0)};
        data.forEach(i => {
            if(lv.hasOwnProperty(i.level)) lv[i.level]++;
            dp[i.dept] = (dp[i.dept] || 0) + 1;
            if(tr[i.yr]) tr[i.yr][i.mo]++;
        });
        return { lv, dp, tr };
    }

    function initCharts(data) {
        const r = getAgg(data);
        Chart.register(ChartDataLabels);

        // Bar Chart (2/3)
        deptChart = new Chart(document.getElementById('deptChart'), {
            type: 'bar',
            data: { labels: Object.keys(r.dp), datasets: [{ label: 'Số vụ', data: Object.values(r.dp), backgroundColor: '#2980b9' }] },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } } }, // Chỉ hiện số nguyên
                plugins: { legend: false, title: { display: true, text: 'SỐ LƯỢNG THEO KHOA/PHÒNG' } }
            }
        });

        // Doughnut (1/3)
        levelChart = new Chart(document.getElementById('levelChart'), {
            type: 'doughnut',
            data: { labels: ['Nhẹ', 'TB', 'Nặng'], datasets: [{ data: [r.lv['Nhẹ'], r.lv['TB'], r.lv['Nặng']], backgroundColor: ['#3498db', '#f39c12', '#e74c3c'] }] },
            options: {
                responsive: true, maintainAspectRatio: false, cutout: '65%',
                plugins: { legend: { position: 'bottom' }, datalabels: { color: '#fff', formatter: (v, ctx) => { const s = ctx.dataset.data.reduce((a,b)=>a+b,0); return v > 0 ? `${v}\n(${(v*100/s).toFixed(0)}%)` : ''; }, textAlign: 'center' } }
            }
        });

        // Trend Line
        trendChart = new Chart(document.getElementById('trendChart'), {
            type: 'line',
            data: {
                labels: ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'],
                datasets: [
                    { label: currentYear-2, data: r.tr[currentYear-2], borderColor: '#ccc', tension: 0.3 },
                    { label: currentYear-1, data: r.tr[currentYear-1], borderColor: '#3498db', tension: 0.3 },
                    { label: currentYear, data: r.tr[currentYear], borderColor: '#e67e22', borderWidth: 3, tension: 0.3 }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }, plugins: { datalabels: false } }
        });
    }

    function filterData() {
        const s = document.getElementById('searchDesc').value.toLowerCase(), d = document.getElementById('filterDept').value, l = document.getElementById('filterLevel').value, start = document.getElementById('startDate').value, end = document.getElementById('endDate').value;
        const st = start ? new Date(start).getTime() : 0, et = end ? new Date(end).setHours(23,59,59,999) : Infinity;

        const filtered = originalData.filter(i => (i.ts >= st && i.ts <= et) && (d==="" || i.dept===d) && (l==="" || i.level===l) && (i.desc.toLowerCase().includes(s) || i.dept.toLowerCase().includes(s)));
        
        renderTable(filtered);
        const r = getAgg(filtered);
        deptChart.data.labels = Object.keys(r.dp);
        deptChart.data.datasets[0].data = Object.values(r.dp);
        levelChart.data.datasets[0].data = [r.lv['Nhẹ'], r.lv['TB'], r.lv['Nặng']];
        trendChart.data.datasets[0].data = r.tr[currentYear-2];
        trendChart.data.datasets[1].data = r.tr[currentYear-1];
        trendChart.data.datasets[2].data = r.tr[currentYear];
        [deptChart, levelChart, trendChart].forEach(c => c.update('none'));
    }

    function renderTable(data) {
        document.getElementById('tableBody').innerHTML = data.map(row => `<tr><td>${row.date}</td><td>${row.dept}</td><td>${row.desc}</td><td><span class="status-pill status-${row.levelClass}">${row.level}</span></td></tr>`).join('');
    }

    function populateDeptFilter(data) {
        const depts = [...new Set(data.map(i => i.dept))].filter(Boolean).sort();
        document.getElementById('filterDept').innerHTML = '<option value="">-- Tất cả --</option>' + depts.map(d => `<option value="${d}">${d}</option>`).join('');
    }
</script>
</body>
</html>
