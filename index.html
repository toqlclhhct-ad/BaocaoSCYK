<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Sự cố - Bệnh viện</title>
    <style>
        :root { --primary: #2980b9; --bg: #f4f7f6; --success: #27ae60; --orange: #f39c12; --danger: #e74c3c; --ai-purple: #8e44ad; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 15px; }
        .btn-new { background: var(--success); color: white; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; font-size: 14px; }
        
        /* Dashboard & Filters */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 15px; margin-bottom: 20px; }
        .card { background: #fff; padding: 10px; border-radius: 10px; border: 1px solid #eee; height: 220px; }
        .filters { display: flex; flex-wrap: wrap; gap: 10px; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #eee; }
        .f-group { display: flex; flex-direction: column; gap: 5px; }
        .f-group label { font-size: 11px; font-weight: bold; color: #666; }
        .f-group input, .f-group select { padding: 6px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }

        /* Table Area */
        .table-area { overflow-y: auto; border: 1px solid #eee; border-radius: 8px; height: 450px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: var(--primary); color: white; padding: 12px; text-align: left; position: sticky; top: 0; z-index: 10; }
        td { padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        tr:hover { background: #f1f7ff; }

        .pill { padding: 4px 10px; border-radius: 20px; color: white; font-weight: bold; font-size: 11px; }
        .status-Nhẹ { background: #3498db; }
        .status-TB { background: var(--orange); }
        .status-Nặng { background: var(--danger); }

        /* Modal Structure */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
        .modal-content { background: white; margin: 2% auto; width: 95%; max-width: 1100px; border-radius: 12px; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; }
        .modal-header { padding: 15px 20px; border-bottom: 2px solid var(--primary); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: white; z-index: 100; }
        
        .detail-body { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; }
        .info-panel { border-right: 1px solid #eee; padding-right: 20px; font-size: 13px; }
        .ai-panel { background: #fcfaff; border-radius: 10px; padding: 20px; border: 1px solid #e0d0f0; height: fit-content; position: sticky; top: 20px; }

        .detail-item { border-bottom: 1px solid #f5f5f5; padding: 6px 0; display: flex; }
        .detail-label { font-weight: bold; color: var(--primary); width: 160px; flex-shrink: 0; }

        /* AI Buttons & Results */
        .btn-ai { background: var(--ai-purple); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 14px; transition: 0.3s; }
        .btn-ai:hover { opacity: 0.9; }
        .btn-ai:disabled { background: #bdc3c7; }
        
        .ai-box { background: white; border-left: 4px solid var(--ai-purple); padding: 15px; margin-top: 15px; font-size: 13px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .progress-bar { height: 10px; background: #eee; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--success); width: 0%; transition: 1s ease; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div style="display:flex; align-items:center; gap:12px;">
            <img src="https://i.postimg.cc/s2zWMnCs/Logo-Benh-vien.jpg" width="40" alt="Logo">
            <h2 style="color:var(--primary); margin:0;">QUẢN LÝ SỰ CỐ Y KHOA 2026</h2>
        </div>
        <a href="form.html" class="btn-new">+ BÁO CÁO MỚI</a>
    </header>

    <div class="dashboard-grid">
        <div class="card"><canvas id="deptChart"></canvas></div>
        <div class="card"><canvas id="levelChart"></canvas></div>
        <div class="card"><canvas id="trendChart"></canvas></div>
    </div>

    <div class="filters">
        <div class="f-group"><label>Khoa</label><select id="fDept"><option value="">-- Tất cả --</option></select></div>
        <div class="f-group"><label>Mức độ</label><select id="fLevel"><option value="">-- Tất cả --</option><option value="Nhẹ">Nhẹ</option><option value="TB">TB</option><option value="Nặng">Nặng</option></select></div>
        <div class="f-group" style="flex-grow:1;"><label>Tìm nhanh</label><input type="text" id="sKey" placeholder="Gõ nội dung cần tìm..."></div>
    </div>

    <div class="table-area">
        <table id="mainTable">
            <thead>
                <tr>
                    <th style="width: 100px;">Ngày BC</th>
                    <th style="width: 150px;">Khoa/Phòng</th>
                    <th>Mô tả tóm tắt sự cố</th>
                    <th style="width: 80px; text-align:center">Mức độ</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="4" style="text-align:center; padding:50px;">⏳ Đang đồng bộ dữ liệu...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="detailModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="margin:0; color:var(--primary);">HỒ SƠ CHI TIẾT SỰ CỐ</h3>
            <span style="font-size:30px; cursor:pointer;" onclick="closeModal()">&times;</span>
        </div>
        <div class="detail-body">
            <div class="info-panel" id="modalBody"></div>
            <div class="ai-panel">
                <button class="btn-ai" id="btnRunAI" onclick="runAI()">✨ PHÂN TÍCH AI (GEMINI PRO)</button>
                
                <div id="aiLoading" style="display:none; text-align:center; padding:20px;">
                    <p style="color: var(--ai-purple); animation: pulse 1s infinite;">🤖 Hệ thống đang kết nối AI...</p>
                </div>

                <div id="aiResult" style="display:none;">
                    <div class="ai-box"><strong>⚠️ NGUYÊN NHÂN (RCA):</strong><p id="aiRoot" style="margin-top:5px;"></p></div>
                    <div class="ai-box"><strong>📋 ĐỀ XUẤT KHẮC PHỤC:</strong><p id="aiPlan" style="margin-top:5px;"></p></div>
                    <div style="margin-top:15px;">
                        <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:bold;">
                            <span>TIẾN ĐỘ GIẢ ĐỊNH:</span><span id="pText">0%</span>
                        </div>
                        <div class="progress-bar"><div class="progress-fill" id="pFill"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

<script>
    // 🔗 CẤU HÌNH HỆ THỐNG
    const scriptURL = 'https://script.google.com/macros/s/AKfycbynaVlHpUE79D4fnczE04D_r83k0F3d_V4YBRVwOsWfhbWv47rdiGomoqQAdtX784U/exec';
    
    // 🔑 DÁN API KEY CỦA BẠN VÀO ĐÂY
    const API_KEY = "AIzaSyBhJuHaTQ1FAabKzqkOhuiQr34C2G40UPQ";

    let db = [], filtered = [], charts = {};

    // --- GIẢI PHÁP AI GỠ LỖI TRIỆT ĐỂ (Dùng Fetch + Gemini Pro) ---
    async function runAI() {
        const btn = document.getElementById('btnRunAI');
        const loading = document.getElementById('aiLoading');
        const result = document.getElementById('aiResult');
        const idx = document.getElementById('detailModal').dataset.index;

        if (!API_KEY || API_KEY.includes("AIzaSyBhJuHaTQ1FAabKzqkOhuiQr34C2G40UPQ")) return alert("Lỗi: Bạn chưa dán API Key vào mã nguồn!");

        btn.disabled = true;
        loading.style.display = "block";
        result.style.display = "none";

        const rowData = JSON.stringify(filtered[idx].fullData);

        try {
            // Sử dụng model 'gemini-pro' thay cho flash để tránh lỗi 404 Not Found
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${API_KEY}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: `Bạn là chuyên gia an toàn y tế. Hãy phân tích sự cố sau: ${rowData}. 
                            Trả về kết quả duy nhất dưới dạng JSON không chứa ký tự markdown:
                            {"nguyen_nhan": "Mô tả nguyên nhân gốc rễ ngắn gọn", "ke_hoach": "Các bước khắc phục cụ thể", "tien_do": 75}`
                        }]
                    }]
                })
            });

            const json = await response.json();
            
            if (json.error) {
                // Nếu vẫn lỗi 404 với gemini-pro, thử chuyển sang v1 thay vì v1beta
                throw new Error(json.error.message);
            }

            const rawText = json.candidates[0].content.parts[0].text;
            const data = JSON.parse(rawText.replace(/```json|```/g, "").trim());

            document.getElementById('aiRoot').innerText = data.nguyen_nhan;
            document.getElementById('aiPlan').innerText = data.ke_hoach;
            document.getElementById('pFill').style.width = data.tien_do + "%";
            document.getElementById('pText').innerText = data.tien_do + "%";

            loading.style.display = "none";
            result.style.display = "block";
        } catch (e) {
            console.error("AI Error:", e);
            alert("Lỗi AI: Key của bạn có thể chưa kích hoạt model này hoặc bị giới hạn vùng. Chi tiết: " + e.message);
            loading.style.display = "none";
        } finally {
            btn.disabled = false;
        }
    }

    // --- LOGIC XỬ LÝ DỮ LIỆU ---
    async function loadData() {
        try {
            const res = await fetch(`${scriptURL}?action=read`);
            const raw = await res.json();
            db = raw.map(row => {
                const val = Object.values(row);
                const lvRaw = row["Đánh giá ban đầu về mức độ ảnh hưởng"] || val[23] || "Nhẹ";
                let lv = lvRaw.includes("Trung bình") || lvRaw.includes("TB") ? "TB" : (lvRaw.includes("Nặng") ? "Nặng" : "Nhẹ");
                return {
                    date: row["Ngày báo cáo"] || val[3] || "---",
                    dept: row["Khoa/phòng/vị trí xảy ra"] || val[11] || "KĐ",
                    desc: row["Mô tả ngắn gọn"] || val[15] || "---",
                    level: lv,
                    fullData: row
                };
            });
            filtered = [...db];
            renderTable();
            initFilters();
            initCharts();
        } catch (e) { 
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">Lỗi kết nối dữ liệu Google Sheets!</td></tr>';
        }
    }

    function renderTable() {
        const body = document.getElementById('tableBody');
        body.innerHTML = filtered.map((i, idx) => `
            <tr onclick="showDetail(${idx})">
                <td>${i.date}</td>
                <td><b>${i.dept}</b></td>
                <td>${i.desc}</td>
                <td style="text-align:center"><span class="pill status-${i.level}">${i.level}</span></td>
            </tr>
        `).join('') || '<tr><td colspan="4" style="text-align:center;">Không tìm thấy kết quả phù hợp.</td></tr>';
    }

    function showDetail(idx) {
        const modal = document.getElementById('detailModal');
        const item = filtered[idx].fullData;
        modal.dataset.index = idx;
        
        document.getElementById('modalBody').innerHTML = Object.keys(item).map(key => `
            <div class="detail-item"><span class="detail-label">${key}:</span><span>${item[key] || "---"}</span></div>
        `).join('');
        
        document.getElementById('aiResult').style.display = "none";
        document.getElementById('aiLoading').style.display = "none";
        modal.style.display = "block";
    }

    function closeModal() { document.getElementById('detailModal').style.display = "none"; }

    function initFilters() {
        const depts = [...new Set(db.map(i => i.dept))].sort();
        const sel = document.getElementById('fDept');
        depts.forEach(d => sel.add(new Option(d, d)));
        
        document.querySelectorAll('.filters input, .filters select').forEach(el => {
            el.oninput = () => {
                const d = document.getElementById('fDept').value;
                const l = document.getElementById('fLevel').value;
                const k = document.getElementById('sKey').value.toLowerCase();
                filtered = db.filter(i => (d==="" || i.dept===d) && (l==="" || i.level===l) && i.desc.toLowerCase().includes(k));
                renderTable();
            };
        });
    }

    function initCharts() {
        // Khởi tạo biểu đồ cơ bản (Rút gọn)
    }

    document.addEventListener('DOMContentLoaded', loadData);
    window.onclick = (e) => { if(e.target.id === 'detailModal') closeModal(); };
</script>
</body>
</html>
