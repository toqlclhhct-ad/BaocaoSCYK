<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sự cố - Đăng nhập</title>
    <style>
        /* GIỮ NGUYÊN TOÀN BỘ CSS "INDEX VỪA Ý" CỦA BẠN */
        :root { --primary: #2980b9; --bg: #f4f7f6; --success: #27ae60; --orange: #f39c12; --danger: #e74c3c; --ai-purple: #8e44ad; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 1600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); display: none; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 15px; }
        .btn-new { background: var(--success); color: white; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 0.8fr 1.2fr; gap: 15px; margin-bottom: 20px; }
        .card { background: #fff; padding: 15px; border-radius: 10px; border: 1px solid #eee; height: 250px; position: relative; }
        .filters { display: flex; flex-wrap: wrap; gap: 12px; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #eee; }
        .f-group { display: flex; flex-direction: column; gap: 5px; }
        .f-group label { font-size: 12px; font-weight: bold; color: #666; }
        .f-group input, .f-group select { padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
        .table-area { overflow-x: auto; border: 1px solid #eee; border-radius: 8px; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 800px; }
        th { background: var(--primary); color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        tr:hover { background: #f1f7ff; }
        .pill { padding: 4px 10px; border-radius: 20px; color: white; font-weight: bold; font-size: 11px; }
        .status-Nhẹ { background: #3498db; } .status-TB { background: var(--orange); } .status-Nặng { background: var(--danger); }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .modal-content { background: white; margin: 1% auto; width: 90%; max-width: 1100px; border-radius: 12px; max-height: 95vh; overflow-y: auto; }
        .modal-header { position: sticky; top: 0; background: white; z-index: 10; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding: 15px 20px; }
        .detail-body { padding: 20px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
        .detail-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .detail-item { border-bottom: 1px solid #f0f0f0; padding: 6px 0; font-size: 12px; }
        .detail-label { font-weight: bold; color: var(--primary); }
        .highlight-red .detail-label { color: var(--danger) !important; }

        /* CSS MỚI CHO LOGIN OVERLAY */
        #loginOverlay { position: fixed; inset: 0; background: var(--primary); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 40px; border-radius: 15px; width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .login-card input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 12px; background: var(--success); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-action { padding: 10px 15px; border-radius: 4px; border: none; color: white; cursor: pointer; font-weight: bold; margin-right: 5px; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <img src="https://i.postimg.cc/s2zWMnCs/Logo-Benh-vien.jpg" width="70">
        <h2 style="color:var(--primary)">HỆ THỐNG QUẢN LÝ</h2>
        <input type="text" id="user" placeholder="Tên đăng nhập">
        <input type="password" id="pass" placeholder="Mật khẩu">
        <button class="btn-login" onclick="handleLogin()">ĐĂNG NHẬP</button>
        <p id="loginMsg" style="color:red; font-size:13px; margin-top:10px;"></p>
    </div>
</div>

<div class="container" id="mainApp">
    <header>
        <div style="display:flex; align-items:center; gap:15px;">
            <img src="https://i.postimg.cc/s2zWMnCs/Logo-Benh-vien.jpg" width="50" alt="Logo">
            <h2 style="color:var(--primary); margin:0;">HỆ THỐNG QUẢN LÝ SỰ CỐ Y KHOA</h2>
        </div>
        <div>
            <span id="userDisplay" style="margin-right:15px; font-weight:bold; color:#666;"></span>
            <a href="form.html" target="_blank" class="btn-new">+ BÁO CÁO MỚI</a>
        </div>
    </header>

    <div class="dashboard-grid">
        <div class="card"><canvas id="deptChart"></canvas></div>
        <div class="card"><canvas id="levelChart"></canvas></div>
        <div class="card"><canvas id="trendChart"></canvas></div>
    </div>

    <div class="filters">
        <div class="f-group"><label>Từ ngày</label><input type="date" id="startD"></div>
        <div class="f-group"><label>Đến ngày</label><input type="date" id="endD"></div>
        <div class="f-group"><label>Khoa xảy ra</label><select id="fDept"><option value="">-- Tất cả --</option></select></div>
        <div class="f-group"><label>Mức độ</label><select id="fLevel"><option value="">-- Tất cả --</option><option value="Nhẹ">Nhẹ</option><option value="TB">TB</option><option value="Nặng">Nặng</option></select></div>
        <div class="f-group" style="flex-grow:1;"><label>Tìm kiếm theo MÔ TẢ</label><input type="text" id="sKey" placeholder="Số hồ sơ, nội dung sự cố..."></div>
    </div>

    <div class="table-area">
        <table>
            <thead>
                <tr>
                    <th style="width: 100px;">Ngày BC</th>
                    <th style="width: 220px;">Khoa xảy ra</th>
                    <th>Mô tả tóm tắt sự cố</th>
                    <th style="width: 100px; text-align:center">Mức độ</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="paging">
        <div id="pageInfo"></div>
        <div class="page-btns" id="pageNav"></div>
    </div>
</div>

<div id="detailModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="margin:0; color:var(--primary);">CHI TIẾT THÔNG TIN SỰ CỐ</h3>
            <span style="font-size:30px; cursor:pointer;" onclick="closeModal()">&times;</span>
        </div>
        <div class="detail-body">
            <div class="info-panel">
                <div id="modalBody" class="detail-grid"></div>
            </div>
            <div class="ai-panel">
                <div id="actionButtons" style="margin-bottom:20px; padding:15px; background:#f9f9f9; border-radius:8px; border:1px dashed #ccc;">
                    </div>
                <div style="background:#fcfaff; padding:15px; border-radius:8px; border:1px solid #e0d0f0;">
                    <h4 style="color:var(--ai-purple); margin-top:0;">GHI CHÚ / NHẬN XÉT</h4>
                    <textarea id="commentArea" style="width:100%; height:100px; border:1px solid #ddd; padding:10px; border-radius:5px; box-sizing:border-box;"></textarea>
                    <button class="btn-new" style="width:100%; background:var(--ai-purple); margin-top:10px;">LƯU NHẬN XÉT</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbw7p_C-37lz_Ww-pHCXoAYEyZvHaWryG_npLjiWV0TU7IUYMQVxezs1simNHZmZy6M/exec'; 
    let db = [], filtered = [];
    let currentPage = 1;
    const limit = 10;
    let charts = {};
    let currentUser = null;

    // --- XỬ LÝ ĐĂNG NHẬP ---
    function handleLogin() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        const msg = document.getElementById('loginMsg');
        msg.innerText = "Đang kiểm tra...";

        google.script.run.withSuccessHandler(res => {
            if(res.status === "success") {
                currentUser = res;
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                document.getElementById('userDisplay').innerText = `Chào: ${res.dept} (${res.role})`;
                loadData();
            } else {
                msg.innerText = "Sai tài khoản hoặc mật khẩu!";
            }
        }).checkLogin(u, p);
    }

    // --- TẢI DỮ LIỆU ---
    async function loadData() {
        try {
            const res = await fetch(`${scriptURL}?action=read`);
            const json = await res.json();
            db = json.map(row => {
                const val = Object.values(row); 
                const dateStr = row["Ngày báo cáo"] || val[3] || "";
                const dateObj = parseDate(dateStr);
                const levelRaw = row["Đánh giá ban đầu về mức độ ảnh hưởng"] || val[23] || "Nhẹ";
                let lv = levelRaw.includes("Trung bình") || levelRaw.includes("TB") ? "TB" : (levelRaw.includes("Nặng") ? "Nặng" : "Nhẹ");
                
                return {
                    date: `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`,
                    dept: row["Khoa/phòng/vị trí xảy ra"] || val[11] || "KĐ",
                    desc: row["Mô tả ngắn gọn"] || val[15] || "",
                    reporter: row["Đơn vị báo cáo"] || val[9] || "", // Giả sử cột Đơn vị báo cáo ở Index 9
                    level: lv,
                    ts: dateObj.getTime(),
                    month: dateObj.getMonth(),
                    year: dateObj.getFullYear(),
                    fullData: row
                };
            });
            filtered = [...db];
            updateFilters();
            initCharts();
            render();
        } catch (e) { console.error(e); }
    }

    // --- HIỂN THỊ CHI TIẾT & PHÂN QUYỀN ---
    function showDetail(index) {
        const item = filtered[index];
        const data = item.fullData;
        const body = document.getElementById('modalBody');
        const redItems = [16, 17, 18, 24]; 

        body.innerHTML = Object.keys(data).map((key, i) => {
            const isRed = redItems.includes(i + 1);
            return `<div class="detail-item ${isRed ? 'highlight-red' : ''}"><span class="detail-label">${key}:</span> ${data[key] || "---"}</div>`;
        }).join('');

        // LOGIC PHÂN QUYỀN NÚT BẤM
        let canEditDelete = false;
        if(['Admin', 'BGD', 'QLCL'].includes(currentUser.role)) {
            canEditDelete = true;
        } else if (currentUser.dept === item.reporter) {
            canEditDelete = true;
        }

        const actionArea = document.getElementById('actionButtons');
        if(canEditDelete) {
            actionArea.innerHTML = `
                <p style="margin:0 0 10px 0; font-weight:bold; color:var(--primary);">QUẢN LÝ BÁO CÁO:</p>
                <button class="btn-action" style="background:var(--orange)" onclick="alert('Tính năng đang phát triển')">SỬA BÁO CÁO</button>
                <button class="btn-action" style="background:var(--danger)" onclick="alert('Tính năng đang phát triển')">XÓA BÁO CÁO</button>
            `;
        } else {
            actionArea.innerHTML = `<p style="color:#888; font-style:italic; font-size:12px;">Bạn chỉ có quyền xem và nhận xét sự cố của đơn vị khác.</p>`;
        }
        
        document.getElementById('detailModal').style.display = "block";
    }

    // --- CÁC HÀM CƠ BẢN (GIỮ NGUYÊN TỪ INDEX VỪA Ý) ---
    function parseDate(s) {
        if(!s) return new Date();
        if(typeof s === 'string' && s.includes('/')) {
            const p = s.split('/'); return new Date(p[2], p[1]-1, p[0]);
        }
        const d = new Date(s); return isNaN(d.getTime()) ? new Date() : d;
    }

    function render() {
        const start = (currentPage - 1) * limit;
        const data = filtered.slice(start, start + limit);
        document.getElementById('tableBody').innerHTML = data.map((i, idx) => `
            <tr onclick="showDetail(${start + idx})">
                <td>${i.date}</td>
                <td><b>${i.dept}</b></td>
                <td>${i.desc}</td>
                <td style="text-align:center"><span class="pill status-${i.level}">${i.level}</span></td>
            </tr>
        `).join('') || '<tr><td colspan="4">Không tìm thấy kết quả</td></tr>';
        document.getElementById('pageInfo').innerText = `Hiển thị ${data.length}-${filtered.length}`;
        renderPaging();
    }

    function renderPaging() {
        const total = Math.ceil(filtered.length / limit);
        const nav = document.getElementById('pageNav'); nav.innerHTML = '';
        for(let i=1; i<=total; i++) {
            const b = document.createElement('button');
            b.className = `btn-p ${i === currentPage ? 'active' : ''}`;
            b.innerText = i; b.onclick = () => { currentPage = i; render(); };
            nav.appendChild(b);
        }
    }

    function filterData() {
        const start = document.getElementById('startD').value;
        const end = document.getElementById('endD').value;
        const dept = document.getElementById('fDept').value;
        const level = document.getElementById('fLevel').value;
        const key = document.getElementById('sKey').value.toLowerCase();
        const sTs = start ? new Date(start).getTime() : 0;
        const eTs = end ? new Date(end).setHours(23,59,59) : Infinity;
        filtered = db.filter(i => (i.ts >= sTs && i.ts <= eTs) && (dept === "" || i.dept === dept) && (level === "" || i.level === level) && (i.desc.toLowerCase().includes(key)));
        currentPage = 1; render(); updateCharts();
    }

    function updateFilters() {
        const depts = [...new Set(db.map(i => i.dept))].sort();
        const sel = document.getElementById('fDept');
        sel.innerHTML = '<option value="">-- Tất cả --</option>';
        depts.forEach(d => sel.add(new Option(d, d)));
    }

    function initCharts() {
        Chart.register(ChartDataLabels);
        const data = getAgg();
        charts.dept = new Chart(document.getElementById('deptChart'), { type: 'bar', data: { labels: data.labels, datasets: [{ data: data.counts, backgroundColor: '#2980b9' }] }, options: { maintainAspectRatio: false, plugins: { legend: { display: false }, title: { display:true, text:'SỰ CỐ THEO KHOA/PHÒNG' } } } });
        charts.level = new Chart(document.getElementById('levelChart'), { type: 'pie', data: { labels: ['Nhẹ', 'TB', 'Nặng'], datasets: [{ data: data.lv, backgroundColor: ['#3498db', '#f39c12', '#e74c3c'] }] }, options: { maintainAspectRatio: false, plugins: { title: { display:true, text:'TỶ LỆ % MỨC ĐỘ' } } } });
        charts.trend = new Chart(document.getElementById('trendChart'), { type: 'line', data: { labels: ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'], datasets: [{ label: '2026', data: data.trend[2026], borderColor: '#2980b9' }] }, options: { maintainAspectRatio: false } });
    }

    function updateCharts() { const data = getAgg(); charts.dept.data.labels = data.labels; charts.dept.data.datasets[0].data = data.counts; charts.level.data.datasets[0].data = data.lv; charts.dept.update(); charts.level.update(); }
    function getAgg() { const depts = {}, lv = { Nhẹ: 0, TB: 0, Nặng: 0 }, trend = { 2026: Array(12).fill(0) }; filtered.forEach(i => { depts[i.dept] = (depts[i.dept] || 0) + 1; if(lv.hasOwnProperty(i.level)) lv[i.level]++; if(trend[i.year]) trend[i.year][i.month]++; }); return { labels: Object.keys(depts), counts: Object.values(depts), lv: [lv.Nhẹ, lv.TB, lv.Nặng], trend }; }
    function closeModal() { document.getElementById('detailModal').style.display = "none"; }
    document.addEventListener('keydown', (e) => { if (e.key === "Escape") closeModal(); });
</script>
</body>
</html>
