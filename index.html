<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Sự cố - Full Data & Pagination</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <style>
        :root { --title-color: #2980b9; --bg-body: #f4f7f6; --success-color: #27ae60; --orange-color: #f39c12; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-body); padding: 10px; margin: 0; }
        .container { max-width: 1500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--title-color); margin-bottom: 15px; padding-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-left h2 { color: var(--title-color); text-transform: uppercase; margin: 0; font-size: 18px; }
        .btn-new { background: var(--success-color); color: white; text-decoration: none; padding: 8px 18px; border-radius: 6px; font-weight: bold; font-size: 14px; }

        /* Dashboard layout */
        .dashboard-top { display: grid; grid-template-columns: 2fr 1fr; gap: 15px; margin-bottom: 15px; }
        .chart-card { background: #fff; padding: 10px; border-radius: 10px; border: 1px solid #eee; height: 260px; }
        .trend-card { width: 100%; height: 240px; margin-bottom: 15px; padding: 10px; border: 1px solid #eee; border-radius: 10px; }
        
        .filter-section { display: flex; flex-wrap: wrap; gap: 10px; background: #f9f9f9; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #eee; }
        .filter-group { display: flex; flex-direction: column; gap: 4px; }
        .filter-group label { font-size: 11px; font-weight: bold; color: #555; }
        .filter-group input, .filter-group select { padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        
        /* Table & Pagination */
        .table-container { 
            overflow-y: auto; 
            height: calc(100vh - 650px); 
            min-height: 450px;
            border: 1px solid #eee; 
            border-radius: 8px; 
        }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { background-color: var(--title-color); color: white; padding: 12px 10px; text-align: left; position: sticky; top: 0; z-index: 10; }
        td { padding: 12px 10px; border-bottom: 1px solid #f0f0f0; }
        tr:nth-child(even) { background-color: #fcfcfc; }

        .pagination-container { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding: 0 10px; }
        .pagination-info { font-size: 13px; color: #666; }
        .pagination-buttons { display: flex; gap: 5px; }
        .btn-page { padding: 6px 12px; border: 1px solid #ddd; background: white; cursor: pointer; border-radius: 4px; font-size: 13px; transition: 0.2s; }
        .btn-page.active { background: var(--title-color); color: white; border-color: var(--title-color); font-weight: bold; }
        .btn-page:hover:not(.active):not(:disabled) { background: #f0f0f0; }
        .btn-page:disabled { color: #ccc; cursor: not-allowed; }

        .status-pill { padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: bold; color: white; display: inline-block; min-width: 65px; text-align: center; }
        .status-Nặng { background: #e74c3c; } 
        .status-TB { background: var(--orange-color); } 
        .status-Nhẹ { background: #3498db; }

        @media (max-width: 1024px) { .dashboard-top { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-left">
            <img src="https://i.postimg.cc/s2zWMnCs/Logo-Benh-vien.jpg" alt="Logo" style="width: 40px;">
            <h2>Hệ thống Quản lý Sự cố</h2>
        </div>
        <a href="form.html" class="btn-new">+ TẠO MỚI</a>
    </header>

    <div class="dashboard-top">
        <div class="chart-card"><canvas id="deptChart"></canvas></div>
        <div class="chart-card"><canvas id="levelChart"></canvas></div>
    </div>
    
    <div class="trend-card"><canvas id="trendChart"></canvas></div>

    <div class="filter-section">
        <div class="filter-group"><label>Từ ngày:</label><input type="date" id="startDate"></div>
        <div class="filter-group"><label>Đến ngày:</label><input type="date" id="endDate"></div>
        <div class="filter-group"><label>Khoa:</label><select id="filterDept"><option value="">-- Tất cả --</option></select></div>
        <div class="filter-group"><label>Mức độ:</label><select id="filterLevel"><option value="">-- Tất cả --</option><option value="Nhẹ">Nhẹ</option><option value="TB">TB</option><option value="Nặng">Nặng</option></select></div>
        <div class="filter-group" style="flex-grow: 1;"><label>Tìm kiếm:</label><input type="text" id="searchDesc" placeholder="Từ khóa..."></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 100px;">Ngày BC</th>
                    <th style="width: 180px;">Khoa/Phòng</th>
                    <th>Mô tả chi tiết sự cố</th>
                    <th style="width: 90px; text-align: center;">Mức độ</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="4" style="text-align:center; padding: 40px;">Đang tải dữ liệu toàn bộ hệ thống...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="pagination-container">
        <div class="pagination-info" id="paginationInfo">Hiển thị 0/0 sự cố</div>
        <div class="pagination-buttons" id="paginationButtons"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwsgg3TyHuF60XbkdaHr6uTrXW8akj5Np9f9MjKoC0nNhZoFHnekWpkqpQzAYPpdjQ/exec';
    let originalData = [];   // Chứa toàn bộ dữ liệu từ Sheets
    let filteredData = [];   // Chứa dữ liệu sau khi lọc
    let deptChart, levelChart, trendChart;
    
    // Cấu hình phân trang
    let currentPage = 1;
    const rowsPerPage = 20; // Số dòng hiển thị mỗi trang

    document.addEventListener('DOMContentLoaded', async () => {
        await loadData();
        setupListeners();
    });

    async function loadData() {
        try {
            const res = await fetch(`${scriptURL}?action=read`);
            const raw = await res.json();
            const currentYear = new Date().getFullYear();

            // Lưu trữ toàn bộ dữ liệu và chuẩn hóa
            originalData = raw.map(i => {
                const d = parseDate(i.date);
                let lv = i.level;
                if (lv === "Trung bình" || lv === "TB") lv = "TB";
                return { ...i, level: lv, ts: d.getTime(), yr: d.getFullYear(), mo: d.getMonth() };
            });

            filteredData = [...originalData];
            populateDeptFilter(originalData);
            initCharts(originalData);
            updateDisplay();
        } catch (e) {
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="4" style="color:red; text-align:center;">Lỗi kết nối dữ liệu!</td></tr>';
        }
    }

    function setupListeners() {
        const filters = ['startDate', 'endDate', 'filterDept', 'filterLevel', 'searchDesc'];
        filters.forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                currentPage = 1; // Reset về trang 1 khi lọc
                filterData();
            });
        });
    }

    function parseDate(s) {
        const p = s.split('/');
        return new Date(p[2], p[1]-1, p[0]);
    }

    function filterData() {
        const s = document.getElementById('searchDesc').value.toLowerCase();
        const d = document.getElementById('filterDept').value;
        const l = document.getElementById('filterLevel').value;
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        
        const st = start ? new Date(start).getTime() : 0;
        const et = end ? new Date(end).setHours(23,59,59,999) : Infinity;

        filteredData = originalData.filter(i => 
            (i.ts >= st && i.ts <= et) &&
            (d === "" || i.dept === d) &&
            (l === "" || i.level === l) &&
            (i.desc.toLowerCase().includes(s) || i.dept.toLowerCase().includes(s))
        );

        updateDisplay();
        updateCharts(filteredData);
    }

    function updateDisplay() {
        renderTable();
        renderPaginationControls();
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        const start = (currentPage - 1) * rowsPerPage;
        const end = start + rowsPerPage;
        const pageData = filteredData.slice(start, end);

        tbody.innerHTML = pageData.map(row => `
            <tr>
                <td>${row.date}</td>
                <td>${row.dept}</td>
                <td>${row.desc}</td>
                <td style="text-align: center;"><span class="status-pill status-${row.level}">${row.level}</span></td>
            </tr>
        `).join('') || '<tr><td colspan="4" style="text-align:center; padding: 20px;">Không có dữ liệu phù hợp.</td></tr>';

        // Cập nhật thông tin số lượng
        document.getElementById('paginationInfo').innerText = 
            `Hiển thị ${pageData.length > 0 ? start + 1 : 0} - ${Math.min(end, filteredData.length)} trên tổng số ${filteredData.length} sự cố`;
    }

    function renderPaginationControls() {
        const totalPages = Math.ceil(filteredData.length / rowsPerPage);
        const container = document.getElementById('paginationButtons');
        container.innerHTML = '';

        if (totalPages <= 1) return;

        // Nút Trang đầu
        addPageBtn('<<', 1, currentPage === 1);
        // Nút Trước
        addPageBtn('<', currentPage - 1, currentPage === 1);

        // Hiển thị các số trang (giới hạn hiển thị 5 nút số)
        let startPage = Math.max(1, currentPage - 2);
        let endPage = Math.min(totalPages, startPage + 4);
        if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);

        for (let i = startPage; i <= endPage; i++) {
            addPageBtn(i, i, false, i === currentPage);
        }

        // Nút Sau
        addPageBtn('>', currentPage + 1, currentPage === totalPages);
        // Nút Trang cuối
        addPageBtn('>>', totalPages, currentPage === totalPages);
    }

    function addPageBtn(text, page, disabled, active = false) {
        const btn = document.createElement('button');
        btn.className = `btn-page ${active ? 'active' : ''}`;
        btn.innerText = text;
        btn.disabled = disabled;
        btn.onclick = () => {
            currentPage = page;
            updateDisplay();
            document.querySelector('.table-container').scrollTop = 0; // Cuộn lên đầu bảng
        };
        document.getElementById('paginationButtons').appendChild(btn);
    }

    function initCharts(data) {
        const currentYear = new Date().getFullYear();
        Chart.register(ChartDataLabels);
        const r = getAgg(data, currentYear);

        deptChart = new Chart(document.getElementById('deptChart'), {
            type: 'bar',
            data: { labels: Object.keys(r.dp), datasets: [{ data: Object.values(r.dp), backgroundColor: '#2980b9' }] },
            options: { 
                responsive: true, maintainAspectRatio: false, 
                scales: { y: { ticks: { stepSize: 1, precision: 0 } } }, 
                plugins: { legend: false, title: { display: true, text: 'SỐ VỤ THEO KHOA/PHÒNG' } } 
            }
        });

        levelChart = new Chart(document.getElementById('levelChart'), {
            type: 'doughnut',
            data: { labels: ['Nhẹ', 'TB', 'Nặng'], datasets: [{ data: [r.lv.Nhẹ, r.lv.TB, r.lv.Nặng], backgroundColor: ['#3498db', '#f39c12', '#e74c3c'] }] },
            options: { 
                responsive: true, maintainAspectRatio: false, cutout: '65%',
                plugins: { 
                    legend: { position: 'bottom' },
                    datalabels: { color: '#fff', font: { weight: 'bold' }, formatter: (v, ctx) => {
                        const s = ctx.dataset.data.reduce((a,b)=>a+b,0);
                        return v > 0 ? `${v}\n(${(v*100/s).toFixed(0)}%)` : '';
                    }, textAlign: 'center' }
                }
            }
        });

        trendChart = new Chart(document.getElementById('trendChart'), {
            type: 'line',
            data: {
                labels: ['Th.1','Th.2','Th.3','Th.4','Th.5','Th.6','Th.7','Th.8','Th.9','Th.10','Th.11','Th.12'],
                datasets: [
                    { label: currentYear-2, data: r.tr[currentYear-2], borderColor: '#ccc', tension: 0.3, pointRadius: 2 },
                    { label: currentYear-1, data: r.tr[currentYear-1], borderColor: '#3498db', tension: 0.3, pointRadius: 2 },
                    { label: currentYear, data: r.tr[currentYear], borderColor: '#e67e22', borderWidth: 3, tension: 0.3, pointRadius: 4 }
                ]
            },
            options: { 
                responsive: true, maintainAspectRatio: false, 
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } },
                plugins: { datalabels: false, title: { display: true, text: 'XU HƯỚNG SỰ CỐ THEO THÁNG (3 NĂM)' } } 
            }
        });
    }

    function updateCharts(data) {
        const currentYear = new Date().getFullYear();
        const r = getAgg(data, currentYear);
        deptChart.data.labels = Object.keys(r.dp);
        deptChart.data.datasets[0].data = Object.values(r.dp);
        levelChart.data.datasets[0].data = [r.lv.Nhẹ, r.lv.TB, r.lv.Nặng];
        trendChart.data.datasets[0].data = r.tr[currentYear-2];
        trendChart.data.datasets[1].data = r.tr[currentYear-1];
        trendChart.data.datasets[2].data = r.tr[currentYear];
        [deptChart, levelChart, trendChart].forEach(c => c.update('none'));
    }

    function getAgg(data, yr) {
        const lv = { Nhẹ: 0, TB: 0, Nặng: 0 }, dp = {}, tr = { [yr]: Array(12).fill(0), [yr-1]: Array(12).fill(0), [yr-2]: Array(12).fill(0) };
        data.forEach(i => {
            if(lv.hasOwnProperty(i.level)) lv[i.level]++;
            dp[i.dept] = (dp[i.dept] || 0) + 1;
            if(tr[i.yr]) tr[i.yr][i.mo]++;
        });
        return { lv, dp, tr };
    }

    function populateDeptFilter(data) {
        const depts = [...new Set(data.map(i => i.dept))].filter(Boolean).sort();
        document.getElementById('filterDept').innerHTML = '<option value="">-- Tất cả khoa --</option>' + depts.map(d => `<option value="${d}">${d}</option>`).join('');
    }
</script>
</body>
</html>
