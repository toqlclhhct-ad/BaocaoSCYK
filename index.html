<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Sự cố - Bệnh viện</title>
    <style>
        :root { --primary: #2980b9; --bg: #f4f7f6; --success: #27ae60; --orange: #f39c12; --danger: #e74c3c; --ai-purple: #8e44ad; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 1600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 15px; }
        .btn-new { background: var(--success); color: white; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 0.8fr 1.2fr; gap: 15px; margin-bottom: 20px; }
        .card { background: #fff; padding: 15px; border-radius: 10px; border: 1px solid #eee; height: 250px; position: relative; }
        .filters { display: flex; flex-wrap: wrap; gap: 12px; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #eee; }
        .f-group { display: flex; flex-direction: column; gap: 5px; }
        .f-group label { font-size: 12px; font-weight: bold; color: #666; }
        .f-group input, .f-group select { padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
        .table-area { overflow-x: auto; border: 1px solid #eee; border-radius: 8px; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 800px; }
        th { background: var(--primary); color: white; padding: 12px; text-align: left; position: sticky; top: 0; }
        td { padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        tr:hover { background: #f1f7ff; }
        .pill { padding: 4px 10px; border-radius: 20px; color: white; font-weight: bold; font-size: 11px; }
        .status-Nhẹ { background: #3498db; }
        .status-TB { background: var(--orange); }
        .status-Nặng { background: var(--danger); }
        .paging { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding: 10px; background: #fff; border-radius: 8px; }
        .page-btns { display: flex; gap: 5px; }
        .btn-p { padding: 6px 12px; border: 1px solid #ddd; background: white; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-p.active { background: var(--primary); color: white; border-color: var(--primary); }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .modal-content { background: white; margin: 1% auto; width: 90%; max-width: 1100px; border-radius: 12px; max-height: 95vh; overflow-y: auto; position: relative; }
        .modal-header { position: sticky; top: 0; background: white; z-index: 10; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding: 15px 20px; }
        .close { font-size: 32px; font-weight: bold; cursor: pointer; color: #e74c3c; line-height: 1; }
        .detail-body { padding: 20px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
        .info-panel { border-right: 1px solid #eee; padding-right: 20px; }
        .ai-panel { background: #fcfaff; border-radius: 8px; padding: 15px; border: 1px solid #e0d0f0; }
        .detail-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .detail-item { border-bottom: 1px solid #f0f0f0; padding: 6px 0; font-size: 12px; }
        .detail-label { font-weight: bold; color: var(--primary); }
        .highlight-red .detail-label { color: var(--danger) !important; }
        .btn-ai { background: var(--ai-purple); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 15px; }
        .ai-box { background: white; border-left: 4px solid var(--ai-purple); padding: 10px; margin-bottom: 15px; font-size: 13px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .progress-bar { height: 10px; background: #eee; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--success); width: 0%; transition: 1s; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div style="display:flex; align-items:center; gap:15px;">
            <img src="https://i.postimg.cc/s2zWMnCs/Logo-Benh-vien.jpg" width="50" alt="Logo">
            <h2 style="color:var(--primary); margin:0;">HỆ THỐNG QUẢN LÝ SỰ CỐ Y KHOA</h2>
        </div>
        <a href="form.html" class="btn-new">+ BÁO CÁO MỚI</a>
    </header>
    <div class="dashboard-grid">
        <div class="card"><canvas id="deptChart"></canvas></div>
        <div class="card"><canvas id="levelChart"></canvas></div>
        <div class="card"><canvas id="trendChart"></canvas></div>
    </div>
    <div class="filters">
        <div class="f-group"><label>Từ ngày</label><input type="date" id="startD"></div>
        <div class="f-group"><label>Đến ngày</label><input type="date" id="endD"></div>
        <div class="f-group"><label>Khoa xảy ra</label><select id="fDept"><option value="">-- Tất cả --</option></select></div>
        <div class="f-group"><label>Mức độ</label><select id="fLevel"><option value="">-- Tất cả --</option><option value="Nhẹ">Nhẹ</option><option value="TB">TB</option><option value="Nặng">Nặng</option></select></div>
        <div class="f-group" style="flex-grow:1;"><label>Tìm kiếm theo MÔ TẢ</label><input type="text" id="sKey" placeholder="Số hồ sơ, nội dung sự cố..."></div>
    </div>
    <div class="table-area">
        <table>
            <thead>
                <tr>
                    <th style="width: 100px;">Ngày BC</th>
                    <th style="width: 220px;">Khoa xảy ra</th>
                    <th>Mô tả tóm tắt sự cố</th>
                    <th style="width: 100px; text-align:center">Mức độ</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <div class="paging">
        <div id="pageInfo" style="font-size:13px; color:#666; font-weight: bold;"></div>
        <div class="page-btns" id="pageNav"></div>
    </div>
</div>

<div id="detailModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="margin:0; color:var(--primary);">CHI TIẾT THÔNG TIN SỰ CỐ</h3>
            <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <div class="detail-body">
            <div class="info-panel"><div id="modalBody" class="detail-grid"></div></div>
            <div class="ai-panel">
                <button class="btn-ai" id="btnAI" onclick="runAI()">✨ PHÂN TÍCH AI (TRỢ LÝ CHIẾN LƯỢC)</button>
                <div id="aiLoading" style="display:none; text-align:center;"><p style="color:var(--ai-purple); font-weight:bold;">🤖 Đang phân tích dữ liệu chuyên sâu...</p></div>
                <div id="aiResult" style="display:none;">
                    <h4 style="color:var(--ai-purple); margin-top:0;">🤖 KẾT QUẢ PHÂN TÍCH AI</h4>
                    <div class="ai-box"><strong>Nguyên nhân gốc rễ:</strong><p id="aiRoot"></p></div>
                    <div class="ai-box"><strong>Kế hoạch khắc phục đề xuất:</strong><p id="aiPlan"></p></div>
                    <div class="progress-bar"><div class="progress-fill" id="pFill"></div></div>
                    <div style="display:flex; justify-content:space-between; font-size:11px;"><span>Đã tiếp nhận</span><span id="pText">0%</span></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbynaVlHpUE79D4fnczE04D_r83k0F3d_V4YBRVwOsWfhbWv47rdiGomoqQAdtX784U/exec'; 
    const AI_KEY = "AIzaSyCrgpQIf-uVZGw55VaxuJPpY68Fjmwpl3k"; 
    let db = [], filtered = [], currentPage = 1, limit = 10, charts = {};

    document.addEventListener('DOMContentLoaded', loadData);
    document.querySelectorAll('.filters input, .filters select').forEach(el => el.oninput = filterData);

    async function loadData() {
        try {
            const res = await fetch(`${scriptURL}?action=read`);
            const json = await res.json();
            db = json.map(row => {
                const val = Object.values(row); 
                const dateStr = row["Ngày báo cáo"] || val[3] || "";
                const dateObj = parseDate(dateStr);
                const levelRaw = row["Đánh giá ban đầu về mức độ ảnh hưởng"] || val[23] || "Nhẹ";
                let lv = levelRaw.includes("Nặng") ? "Nặng" : (levelRaw.includes("Trung bình") || levelRaw.includes("TB") ? "TB" : "Nhẹ");
                return { date: dateStr, dept: row["Khoa/phòng/vị trí xảy ra"] || val[11] || "KĐ", desc: row["Mô tả ngắn gọn"] || val[15] || "", level: lv, fullData: row, ts: dateObj.getTime(), month: dateObj.getMonth(), year: dateObj.getFullYear() };
            });
            filtered = [...db];
            updateFilters(); initCharts(); render();
        } catch (e) { document.getElementById('tableBody').innerHTML = '<tr><td colspan="4">Lỗi tải dữ liệu.</td></tr>'; }
    }

    function parseDate(s) { if(!s) return new Date(); const p = s.split('/'); return p.length === 3 ? new Date(p[2], p[1]-1, p[0]) : new Date(s); }

    function filterData() {
        const dept = document.getElementById('fDept').value, level = document.getElementById('fLevel').value, key = document.getElementById('sKey').value.toLowerCase();
        filtered = db.filter(i => (dept === "" || i.dept === dept) && (level === "" || i.level === level) && (i.desc.toLowerCase().includes(key) || i.dept.toLowerCase().includes(key)));
        currentPage = 1; render(); updateCharts();
    }

    function render() {
        const start = (currentPage - 1) * limit, data = filtered.slice(start, start + limit);
        document.getElementById('tableBody').innerHTML = data.map((i, idx) => `<tr onclick="showDetail(${start + idx})"><td>${i.date}</td><td><b>${i.dept}</b></td><td>${i.desc}</td><td style="text-align:center"><span class="pill status-${i.level}">${i.level}</span></td></tr>`).join('');
        document.getElementById('pageInfo').innerText = `Tổng ${filtered.length} sự cố`;
        renderPaging();
    }

    function showDetail(index) {
        const modal = document.getElementById('detailModal');
        modal.dataset.idx = index;
        const item = filtered[index].fullData;
        document.getElementById('modalBody').innerHTML = Object.keys(item).map(k => {
            const isRed = ["Mức độ", "Đánh giá", "Khẩn"].some(word => k.includes(word));
            return `<div class="detail-item ${isRed?'highlight-red':''}"><span class="detail-label">${k}:</span> ${item[k] || "---"}</div>`;
        }).join('');
        document.getElementById('aiResult').style.display = "none";
        modal.style.display = "block";
    }

    async function runAI() {
        const idx = document.getElementById('detailModal').dataset.idx;
        const data = JSON.stringify(filtered[idx].fullData);
        const btn = document.getElementById('btnAI'); const loading = document.getElementById('aiLoading'); const result = document.getElementById('aiResult');
        btn.disabled = true; loading.style.display = "block"; result.style.display = "none";
        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${AI_KEY}`;
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: `Phân tích RCA cho sự cố: ${data}. Trả về JSON (không markdown): {"root": "...", "plan": "...", "percent": 90}` }] }] })
            });
            const json = await response.json();
            const text = json.candidates[0].content.parts[0].text.replace(/```json|```/g, "").trim();
            const res = JSON.parse(text);
            document.getElementById('aiRoot').innerText = res.root;
            document.getElementById('aiPlan').innerText = res.plan;
            document.getElementById('pFill').style.width = res.percent + "%";
            document.getElementById('pText').innerText = res.percent + "%";
            loading.style.display = "none"; result.style.display = "block";
        } catch (e) { alert("Lỗi AI: " + e.message); loading.style.display = "none"; } finally { btn.disabled = false; }
    }

    function closeModal() { document.getElementById('detailModal').style.display = "none"; }
    function renderPaging() {
        const total = Math.ceil(filtered.length / limit), nav = document.getElementById('pageNav'); nav.innerHTML = '';
        for(let i=1; i<=total; i++) {
            const b = document.createElement('button'); b.className = `btn-p ${i === currentPage ? 'active' : ''}`;
            b.innerText = i; b.onclick = () => { currentPage = i; render(); }; nav.appendChild(b);
        }
    }
    function updateFilters() {
        const depts = [...new Set(db.map(i => i.dept))].sort(), sel = document.getElementById('fDept');
        sel.innerHTML = '<option value="">-- Tất cả --</option>'; depts.forEach(d => sel.add(new Option(d, d)));
    }
    function initCharts() {
        Chart.register(ChartDataLabels);
        const options = { maintainAspectRatio: false, plugins: { datalabels: { color: '#000', font: {weight:'bold'}, formatter: Math.round } } };
        charts.dept = new Chart(document.getElementById('deptChart'), { type: 'bar', data: { labels: [], datasets: [{ data: [], backgroundColor: '#2980b9' }] }, options: { ...options, plugins: { ...options.plugins, title: { display:true, text:'THEO KHOA' }, legend: {display:false} } } });
        charts.level = new Chart(document.getElementById('levelChart'), { type: 'pie', data: { labels: ['Nhẹ', 'TB', 'Nặng'], datasets: [{ data: [], backgroundColor: ['#3498db', '#f39c12', '#e74c3c'] }] }, options: { ...options, plugins: { ...options.plugins, title: { display:true, text:'MỨC ĐỘ' } } } });
        charts.trend = new Chart(document.getElementById('trendChart'), { type: 'line', data: { labels: ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'], datasets: [{ label: '2026', data: [], borderColor: '#2980b9' }] }, options: { ...options, plugins: { ...options.plugins, title: { display:true, text:'XU HƯỚNG' } } } });
        updateCharts();
    }
    function updateCharts() {
        const dc = {}, lv = { Nhẹ: 0, TB: 0, Nặng: 0 }, tr = Array(12).fill(0);
        filtered.forEach(i => { dc[i.dept] = (dc[i.dept] || 0) + 1; lv[i.level]++; if(i.year === 2026) tr[i.month]++; });
        charts.dept.data.labels = Object.keys(dc); charts.dept.data.datasets[0].data = Object.values(dc);
        charts.level.data.datasets[0].data = [lv.Nhẹ, lv.TB, lv.Nặng];
        charts.trend.data.datasets[0].data = tr;
        Object.values(charts).forEach(c => c.update());
    }
</script>
</body>
</html>
