<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sự cố Y khoa - Bệnh viện</title>
    <style>
        :root { --primary: #2980b9; --bg: #f4f7f6; --success: #27ae60; --orange: #f39c12; --danger: #e74c3c; --ai-purple: #8e44ad; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 1600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 15px; }
        .btn-new { background: var(--success); color: white; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 0.8fr 1.2fr; gap: 15px; margin-bottom: 20px; }
        .card { background: #fff; padding: 15px; border-radius: 10px; border: 1px solid #eee; height: 260px; position: relative; }
        .filters { display: flex; flex-wrap: wrap; gap: 12px; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #eee; }
        .f-group { display: flex; flex-direction: column; gap: 5px; }
        .f-group label { font-size: 12px; font-weight: bold; color: #666; }
        .f-group input, .f-group select { padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
        .table-area { overflow-x: auto; border: 1px solid #eee; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
        th { background: var(--primary); color: white; padding: 12px; text-align: left; position: sticky; top: 0; z-index: 5; }
        td { padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        tr:hover { background: #f1f7ff; }
        .pill { padding: 4px 10px; border-radius: 20px; color: white; font-weight: bold; font-size: 11px; }
        .status-Nhẹ { background: #3498db; }
        .status-TB { background: var(--orange); }
        .status-Nặng { background: var(--danger); }
        /* Modal Style */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .modal-content { background: white; margin: 2% auto; width: 90%; max-width: 1150px; border-radius: 12px; max-height: 90vh; overflow-y: auto; position: relative; }
        .modal-header { position: sticky; top: 0; background: white; z-index: 10; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding: 15px 20px; }
        .detail-body { padding: 20px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
        .ai-panel { background: #fcfaff; border-radius: 8px; padding: 15px; border: 1px solid #e0d0f0; height: fit-content; }
        .btn-ai { background: var(--ai-purple); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 15px; }
        .ai-box { background: white; border-left: 4px solid var(--ai-purple); padding: 10px; margin-bottom: 15px; font-size: 13px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .progress-bar { height: 10px; background: #eee; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--success); width: 0%; transition: 1s; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div style="display:flex; align-items:center; gap:15px;">
            <img src="https://i.postimg.cc/s2zWMnCs/Logo-Benh-vien.jpg" width="50" alt="Logo">
            <h2 style="color:var(--primary); margin:0;">HỆ THỐNG QUẢN LÝ SỰ CỐ Y KHOA</h2>
        </div>
        <a href="form.html" class="btn-new">+ BÁO CÁO MỚI</a>
    </header>

    <div class="dashboard-grid">
        <div class="card"><canvas id="deptChart"></canvas></div>
        <div class="card"><canvas id="levelChart"></canvas></div>
        <div class="card"><canvas id="trendChart"></canvas></div>
    </div>

    <div class="filters">
        <div class="f-group"><label>Từ ngày</label><input type="date" id="startD"></div>
        <div class="f-group"><label>Đến ngày</label><input type="date" id="endD"></div>
        <div class="f-group"><label>Khoa xảy ra</label><select id="fDept"><option value="">-- Tất cả --</option></select></div>
        <div class="f-group"><label>Mức độ</label><select id="fLevel"><option value="">-- Tất cả --</option><option value="Nhẹ">Nhẹ</option><option value="TB">TB</option><option value="Nặng">Nặng</option></select></div>
        <div class="f-group" style="flex-grow:1;"><label>Tìm kiếm thông tin</label><input type="text" id="sKey" placeholder="Số hồ sơ, nội dung sự cố..."></div>
    </div>

    <div class="table-area">
        <table>
            <thead>
                <tr>
                    <th style="width: 110px;">Ngày BC</th>
                    <th style="width: 200px;">Khoa xảy ra</th>
                    <th>Mô tả tóm tắt sự cố</th>
                    <th style="width: 100px; text-align:center">Mức độ</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="4" style="text-align:center; padding:50px;">Đang tải dữ liệu...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="detailModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="margin:0; color:var(--primary);">CHI TIẾT THÔNG TIN SỰ CỐ</h3>
            <span style="font-size:30px; cursor:pointer; color:red" onclick="closeModal()">&times;</span>
        </div>
        <div class="detail-body">
            <div id="modalBody" style="font-size: 13px; line-height: 1.6;"></div>
            <div class="ai-panel">
                <button class="btn-ai" id="btnAI" onclick="runAI()">✨ PHÂN TÍCH AI CHIẾN LƯỢC</button>
                <div id="aiLoading" style="display:none; text-align:center;">
                    <p style="color:var(--ai-purple); font-weight:bold;">🤖 Đang suy luận nguyên nhân gốc rễ...</p>
                </div>
                <div id="aiResult" style="display:none;">
                    <h4 style="color:var(--ai-purple); margin-top:0;">🤖 KẾT QUẢ PHÂN TÍCH</h4>
                    <div class="ai-box"><strong>Nguyên nhân gốc rễ (RCA):</strong><p id="aiRoot"></p></div>
                    <div class="ai-box"><strong>Giải pháp đề xuất:</strong><p id="aiPlan"></p></div>
                    <div>
                        <strong>Tiến độ khắc phục dự kiến:</strong>
                        <div class="progress-bar"><div class="progress-fill" id="pFill"></div></div>
                        <span id="pText" style="font-size:11px; font-weight:bold;">0%</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbynaVlHpUE79D4fnczE04D_r83k0F3d_V4YBRVwOsWfhbWv47rdiGomoqQAdtX784U/exec'; 
    const AI_KEY = "AIzaSyCrgpQIf-uVZGw55VaxuJPpY68Fjmwpl3k"; // Key mới của bạn
    let db = [], filtered = [], charts = {};

    document.addEventListener('DOMContentLoaded', loadData);
    document.querySelectorAll('.filters input, .filters select').forEach(el => el.oninput = filterData);

    async function loadData() {
        try {
            const res = await fetch(`${scriptURL}?action=read`);
            const json = await res.json();
            db = json.map(row => {
                const val = Object.values(row);
                const dateStr = row["Ngày báo cáo"] || val[3] || "";
                const dateObj = new Date(dateStr.split('/').reverse().join('-')) || new Date();
                const levelRaw = row["Đánh giá ban đầu về mức độ ảnh hưởng"] || val[23] || "Nhẹ";
                let lv = levelRaw.includes("Nặng") ? "Nặng" : (levelRaw.includes("Trung bình") || levelRaw.includes("TB") ? "TB" : "Nhẹ");
                return { 
                    date: dateStr, 
                    dept: row["Khoa/phòng/vị trí xảy ra"] || val[11] || "KĐ", 
                    desc: row["Mô tả ngắn gọn"] || val[15] || "", 
                    level: lv, 
                    fullData: row,
                    ts: dateObj.getTime(),
                    month: dateObj.getMonth()
                };
            });
            filtered = [...db];
            updateFilters();
            initCharts();
            render();
        } catch (e) { document.getElementById('tableBody').innerHTML = '<tr><td colspan="4">Lỗi tải dữ liệu.</td></tr>'; }
    }

    function filterData() {
        const dept = document.getElementById('fDept').value;
        const level = document.getElementById('fLevel').value;
        const key = document.getElementById('sKey').value.toLowerCase();
        filtered = db.filter(i => (dept==="" || i.dept===dept) && (level==="" || i.level===level) && (i.desc.toLowerCase().includes(key) || i.dept.toLowerCase().includes(key)));
        render();
        updateCharts();
    }

    function render() {
        document.getElementById('tableBody').innerHTML = filtered.map((i, idx) => `
            <tr onclick="showDetail(${idx})">
                <td>${i.date}</td><td><b>${i.dept}</b></td><td>${i.desc}</td><td style="text-align:center"><span class="pill status-${i.level}">${i.level}</span></td>
            </tr>`).join('') || '<tr><td colspan="4">Không có dữ liệu.</td></tr>';
    }

    function showDetail(idx) {
        const item = filtered[idx].fullData;
        const modal = document.getElementById('detailModal');
        modal.dataset.current = JSON.stringify(item);
        document.getElementById('modalBody').innerHTML = Object.keys(item).map(k => `<p style="border-bottom:1px solid #eee; padding:5px"><strong>${k}:</strong> ${item[k] || '---'}</p>`).join('');
        document.getElementById('aiResult').style.display = "none";
        modal.style.display = "block";
    }

    async function runAI() {
        const btn = document.getElementById('btnAI');
        const loading = document.getElementById('aiLoading');
        const result = document.getElementById('aiResult');
        const data = document.getElementById('detailModal').dataset.current;

        btn.disabled = true; loading.style.display = "block"; result.style.display = "none";

        try {
            // SỬA LỖI: Sử dụng v1beta và gemini-1.5-flash-latest để tránh lỗi 404
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${AI_KEY}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `Phân tích sự cố y khoa này: ${data}. Trả về JSON (không markdown): {"root": "nguyên nhân", "plan": "giải pháp", "percent": 85}` }] }]
                })
            });

            const json = await response.json();
            if (json.error) throw new Error(json.error.message);

            const text = json.candidates[0].content.parts[0].text.replace(/```json|```/g, "").trim();
            const resJson = JSON.parse(text);

            document.getElementById('aiRoot').innerText = resJson.root;
            document.getElementById('aiPlan').innerText = resJson.plan;
            document.getElementById('pFill').style.width = resJson.percent + "%";
            document.getElementById('pText').innerText = resJson.percent + "%";

            loading.style.display = "none"; result.style.display = "block";
        } catch (e) {
            alert("Lỗi AI: " + e.message);
            loading.style.display = "none";
        } finally { btn.disabled = false; }
    }

    function closeModal() { document.getElementById('detailModal').style.display = "none"; }
    function updateFilters() {
        const depts = [...new Set(db.map(i => i.dept))].sort();
        const sel = document.getElementById('fDept');
        depts.forEach(d => sel.add(new Option(d, d)));
    }
    function initCharts() {
        const ctx1 = document.getElementById('deptChart'), ctx2 = document.getElementById('levelChart'), ctx3 = document.getElementById('trendChart');
        charts.dept = new Chart(ctx1, { type: 'bar', data: { labels: [], datasets: [{ label: 'Sự cố', data: [], backgroundColor: '#2980b9' }] }, options: { maintainAspectRatio: false, plugins: { title: { display: true, text: 'THEO KHOA' } } } });
        charts.level = new Chart(ctx2, { type: 'pie', data: { labels: ['Nhẹ', 'TB', 'Nặng'], datasets: [{ data: [], backgroundColor: ['#3498db', '#f39c12', '#e74c3c'] }] }, options: { maintainAspectRatio: false } });
        charts.trend = new Chart(ctx3, { type: 'line', data: { labels: ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'], datasets: [{ label: '2026', data: [], borderColor: '#2980b9' }] }, options: { maintainAspectRatio: false } });
        updateCharts();
    }
    function updateCharts() {
        const deptCount = {}, lv = { Nhẹ: 0, TB: 0, Nặng: 0 }, trend = Array(12).fill(0);
        filtered.forEach(i => { 
            deptCount[i.dept] = (deptCount[i.dept] || 0) + 1; 
            lv[i.level]++; 
            trend[i.month]++;
        });
        charts.dept.data.labels = Object.keys(deptCount);
        charts.dept.data.datasets[0].data = Object.values(deptCount);
        charts.level.data.datasets[0].data = [lv.Nhẹ, lv.TB, lv.Nặng];
        charts.trend.data.datasets[0].data = trend;
        Object.values(charts).forEach(c => c.update());
    }
</script>
</body>
</html>
